<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showroom opening hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Tuinmaximaal showroom board — CONFIG in the <script> below.
   Brand: forest #003017, deep #001A13, orange #FF8000,
          lime #A2BA1C, white cards, Century Gothic / Jost.
   ============================================================ */
:root{
  --forest:#003017; --forest-2:#001A13;
  --orange:#FF8000; --orange-ink:#C85A0E;
  --lime:#A2BA1C; --sage:#9FB884; --sage-dim:#7F9668;
  --card:#FFFFFF; --ink:#0F241A; --muted:#6C7A72; --hair:#EBF0EA;
  --closed-ink:#455349;
  --dot-quiet:#4E9A2A; --dot-moderate:#E8912A; --dot-busy:#C63F2B;
  --panel:rgba(255,255,255,.055); --panel-border:rgba(255,255,255,.12);
  --hair-soft:rgba(255,255,255,.14);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--forest-2);}
body{font-family:"Century Gothic","Jost","Poppins",system-ui,-apple-system,Segoe UI,sans-serif;
  color:#fff;-webkit-font-smoothing:antialiased;overflow:hidden;}
.ic{width:22px;height:22px;flex-shrink:0;}
#stage>*{width:100%;max-width:var(--maxw);margin-left:auto;margin-right:auto;}

#viewport{position:fixed;inset:0;overflow:hidden;background:var(--forest-2);}
#stage{--maxw:1720px;width:1920px;height:1080px;transform-origin:top left;align-items:center;
  background:radial-gradient(120% 120% at 15% 0%, #013C1E 0%, #00301A 45%, #001A12 100%);
  display:flex;flex-direction:column;padding:50px 60px 30px;}

/* ---------- header ---------- */
.head{display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:1px solid var(--hair-soft);padding-bottom:24px;}
.head__eyebrow{display:none;}
.head__title{font-weight:700;font-size:62px;line-height:.96;letter-spacing:-.01em;color:#fff;}
.head__sub{font-weight:500;font-size:25px;color:var(--sage);margin-top:13px;}
.head__left--inline{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;min-width:0;}
.head__left--inline .head__sub{margin-top:0;position:relative;padding-left:17px;}
.head__left--inline .head__sub::before{content:"";position:absolute;left:0;top:.42em;
  width:5px;height:5px;border-radius:50%;background:var(--sage-dim);}
.head__right{text-align:right;padding-bottom:2px;}
.clock{font-weight:700;font-size:64px;line-height:1;color:#fff;font-variant-numeric:tabular-nums;}
.today{font-weight:500;font-size:24px;color:var(--sage);margin-top:7px;}

/* ---------- two week columns ---------- */
.cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:46px;padding-top:30px;min-height:0;}
.col{display:flex;flex-direction:column;min-height:0;position:relative;}
.col+.col{padding-left:46px;border-left:1px solid var(--hair-soft);margin-left:-46px;}
.col__head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;}
.col__label{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:31px;color:#fff;}
.col__range{font-weight:500;font-size:23px;color:var(--sage);}
.col__body{flex:1;overflow:hidden;min-height:0;}
.fit{display:flex;flex-direction:column;gap:26px;transform-origin:top left;}

/* ---------- section labels ---------- */
.sechead{display:flex;align-items:center;gap:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.14em;font-size:19px;margin-bottom:15px;}
.sechead--changes{color:var(--orange);}
.sechead--open{color:var(--lime);}
.sechead__count{font-weight:600;color:var(--sage-dim);letter-spacing:.06em;}

/* ---------- event cards (one per special day) ---------- */
.cards{display:grid;grid-template-columns:1fr;gap:16px;}
.cards[data-cols="2"]{grid-template-columns:1fr 1fr;}
.cards[data-cols="3"]{grid-template-columns:1fr 1fr 1fr;}
.holi{flex:1;overflow:hidden;min-height:0;padding-top:30px;}
.stage--compact{padding:26px 60px 20px;}
.stage--compact .head{padding-bottom:14px;}
.stage--compact .head__eyebrow{font-size:17px;margin-bottom:5px;}
.stage--compact .head__title{font-size:44px;}
.stage--compact .head__sub{font-size:19px;}
.stage--compact .clock{font-size:48px;}
.stage--compact .today{font-size:20px;margin-top:4px;}
.stage--compact .sched{padding-top:12px;}
.stage--compact .foot{padding-top:12px;}
.stage--compact .brandbar{margin-top:9px;}
/* bare mode: no eyebrow, no footer text, small title, all space for the table */
.stage--bare{padding:30px 60px 24px;}
.stage--bare .head__eyebrow{display:none;}
.stage--bare .head{padding-bottom:16px;}
.stage--bare .head__title{font-size:38px;}
.stage--bare .head__sub{font-size:19px;color:var(--sage);}
.stage--bare .clock{font-size:46px;}
.stage--bare .today{font-size:19px;}
.stage--bare .foot{display:none;}
.stage--bare .sched{padding-top:18px;}


.stage--bare .gc__t{font-size:21px;}
.stage--bare .gc .gdot{width:8px;height:8px;margin-left:10px;}
.stage--bare .gh__d{font-size:14px;}
.stage--bare .gh__n{font-size:23px;}
.stage--bare .gh{padding-bottom:14px;}

.stage--bare .gflag .flg{width:28px;height:19px;}

.stage--bare .grname{font-size:24px;}
.stage--bare .gc--closed svg{width:18px;height:18px;}
/* ---------- schedule grid (main view) ---------- */
.sched{flex:1;overflow:hidden;min-height:0;padding-top:16px;display:flex;flex-direction:column;gap:10px;}
#grid-this{flex:1;min-height:0;}
.sched-inner{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;transform-origin:top center;}
.gwrap__head{display:flex;align-items:baseline;gap:14px;margin-bottom:3px;}
.gwrap__label{font-weight:700;text-transform:uppercase;letter-spacing:.13em;font-size:21px;color:#fff;}
.gwrap__range{font-weight:600;font-size:17px;color:var(--sage);}
/* height:auto, not 100%: a full-height table would spread leftover space over the eleven
   showroom rows, so every week with a different number of campaign rows got its own row
   height. Fixed row heights plus reserved space below keep the grid identical each week. */
.grid{width:100%;height:auto;border-collapse:collapse;table-layout:fixed;}
.grid tbody tr.growrow{height:43px;}
.gh{padding:0 6px 12px;text-align:center;vertical-align:bottom;width:auto;}
th.gh--room{width:23%;}
.gh__d{display:block;font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:13px;color:var(--sage-dim);}
.gh__n{display:block;font-weight:700;font-size:20px;color:#EAF2E6;line-height:1.1;margin-top:3px;}
.gh--today .gh__d,.gh--today .gh__n{color:var(--orange);}
.gh--today{background:rgba(255,255,255,.05);border-radius:12px 12px 0 0;}
.grid tbody tr{border-top:1px solid rgba(255,255,255,.06);}
.grid tbody tr:last-child{border-bottom:1px solid rgba(255,255,255,.07);}
.gc{position:relative;isolation:isolate;text-align:center;vertical-align:middle;
  padding:7px 6px;background:transparent;border:none;line-height:1.15;}
.gc__t{font-weight:600;font-size:17px;color:#DCE7D6;font-variant-numeric:tabular-nums;white-space:nowrap;}
.gc .gdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:9px;
  vertical-align:middle;background:var(--dot);}
.gc--room{text-align:left;padding-left:2px;}
.gflag{display:inline-flex;vertical-align:middle;margin-right:13px;}
.gflag .flg{width:24px;height:16px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.16);display:block;}
.grname{font-weight:600;font-size:20px;color:#fff;vertical-align:middle;}
.gc--closed svg{width:15px;height:15px;fill:var(--sage-dim);opacity:.42;}
.gc--muted{color:var(--sage-dim);font-size:17px;}
.gc--exc .gc__t{color:var(--orange);font-weight:700;}
.gc--exc::before{content:"";position:absolute;inset:4px 7px;border-radius:8px;
  background:rgba(255,128,0,.11);z-index:-1;}
/* today: one soft band down the column instead of seven outlines */
.grid--media{height:auto;}
.grid--media .mbrrow td{padding:0 2px 6px;}
.gc[data-today="1"]{background:rgba(255,255,255,.05);}
.grid tbody tr:last-child .gc[data-today="1"]{border-radius:0 0 12px 12px;}
[data-tip]{cursor:help;}
#tip b{font-weight:700;color:#fff;}
#tip .flg{width:17px;height:12px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.18);
  display:inline-block;vertical-align:-1px;margin-right:2px;}
#tip .flg--txt{width:auto;height:auto;box-shadow:none;vertical-align:0;font-size:10px;}
/* wide enough for "DPG - online advertising: Display advertising · 1 Aug–13 Sept" on one
   line; a line that still wraps gets a hanging indent so it stays readable as one item */
#tip{position:fixed;z-index:99;max-width:min(760px,94vw);background:#0B1F14;
  border:1px solid rgba(255,255,255,.22);color:#F2F6EF;font-weight:600;font-size:15px;
  padding:10px 15px;border-radius:10px;line-height:1.55;font-weight:500;
  box-shadow:0 14px 34px rgba(0,0,0,.55);pointer-events:none;display:none;
  font-family:"Century Gothic","Jost",system-ui,sans-serif;}
#tip.tip--on{display:block;}
#tip .tl{display:block;padding-left:15px;text-indent:-15px;}
#tip .tl:empty{height:8px;}
.gc[data-tip]:hover{background:rgba(255,255,255,.07);}
.mev.mcd__n.gc--muted{color:var(--sage-dim);font-size:17px;background:transparent;border:none;}
.gc--exc{background:rgba(255,128,0,.12);border-color:rgba(255,128,0,.32);}
.gc--exc .gc__t{color:#FFB469;}
/* ---------- responsive refinements ---------- */
.stage--narrow{padding:24px 34px 18px;}
.stage--narrow .head__title{font-size:34px;}
.stage--narrow .head__sub{font-size:16px;}
.stage--narrow .clock{font-size:38px;}
.stage--narrow .today{font-size:17px;}
.stage--narrow .tab{font-size:16px;padding:7px 16px;}

.stage--narrow .grname{font-size:19px;}
.stage--narrow .gflag .flg{width:25px;height:17px;}
.stage--narrow .gc__t{font-size:16px;}
.stage--narrow .monthv__title,.stage--narrow #q-title{font-size:26px;}
.stage--narrow .qcols{gap:24px;}
.stage--narrow .mev__t{font-size:14px;}
.stage--narrow .qev{font-size:13px;}
.stage--tight .head{padding-bottom:10px;}
.stage--tight .tabs{padding-top:10px;}
.stage--tight .sched{padding-top:8px;gap:6px;}
.stage--tight .monthv,.stage--tight #quarterv{padding-top:8px;gap:6px;}
.stage--tight .mcd{padding:6px 8px 5px;}
.stage--phone{padding:18px 16px 14px;}
.stage--phone .head{flex-direction:column;align-items:flex-start;gap:6px;}
.stage--phone .head__left--inline{flex-direction:column;gap:2px;}
.stage--phone .head__left--inline .head__sub{padding-left:0;}
.stage--phone .head__left--inline .head__sub::before{display:none;}
.stage--phone .head__right{text-align:left;}
.stage--phone .clock{font-size:30px;}
.stage--phone .tabs{flex-wrap:wrap;}
.stage--phone th.gh--room{width:27%;}
.stage--phone .grname{font-size:15px;}
.stage--phone .gc__t{font-size:13px;}
.stage--phone .gflag .flg{width:20px;height:14px;}
.stage--phone .qcols{grid-template-columns:1fr;gap:18px;}
.stage--phone #quarterv{overflow-y:auto;min-height:0;}
.stage--phone #q-grid{overflow:visible;}
.stage--phone .monthv__title,.stage--phone #q-title{font-size:22px;}
/* ---------- nav tabs ---------- */
.tabs{display:flex;gap:10px;padding:14px 0 0;}
.tab{display:inline-flex;align-items:center;padding:9px 20px;border-radius:999px;border:1px solid var(--panel-border);
  background:var(--panel);color:var(--sage);font-weight:700;font-size:18px;text-decoration:none;letter-spacing:.02em;}
.tab--on{background:var(--orange);border-color:var(--orange);color:#1B2B1F;}
/* ---------- month calendar (minimal) ---------- */
.monthv{flex:1;overflow:hidden;min-height:0;padding-top:8px;display:flex;flex-direction:column;gap:6px;}
.monthv>#month-grid{flex:1;min-height:0;}
.stage--phone #quarterv>#q-grid{flex:none;}
#month-grid .mcal{height:100%;}
.monthv__bar{display:flex;align-items:baseline;justify-content:space-between;}
.monthv__title{font-weight:700;font-size:34px;color:#fff;letter-spacing:.01em;}
.monthv__nav{display:flex;gap:6px;}
.mbtn{background:transparent;border:none;color:var(--sage);border-radius:10px;
  font:inherit;font-weight:700;font-size:20px;padding:6px 14px;cursor:pointer;}
.mbtn:hover{color:#fff;background:rgba(255,255,255,.06);}
.mbtn--today{color:var(--orange);}
.mcal{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;}
.mch{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:14px;color:var(--sage-dim);
  padding:0 10px 8px;text-align:left;}
.mch--w{width:52px;}
.mcw{font-weight:700;font-size:13px;color:var(--sage-dim);vertical-align:top;padding:12px 0 0 2px;text-align:left;
  border-top:1px solid var(--hair-soft);letter-spacing:.08em;}
.mcd{position:relative;vertical-align:top;padding:8px 10px 14px;border-top:1px solid var(--hair-soft);}
.mcd__n{font-weight:600;font-size:15px;color:var(--sage-dim);line-height:1;margin-bottom:7px;}
.mcd__n--today{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin:-5px 0 3px -6px;
  border-radius:50%;background:var(--orange);color:#1B2B1F;font-weight:700;font-size:15px;}
.mcd--out{border-top:1px solid var(--hair-soft);}
.mcd--past{opacity:.38;}
.mev{margin-bottom:7px;}
/* month day cell: one chip per kind of information */
.mchip{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;line-height:1.15;
  padding:3px 7px;margin-bottom:4px;border-radius:6px;cursor:help;background:rgba(255,255,255,.05);
  border-left:3px solid var(--mc,#8FA37E);color:#E7EFE2;}
.mchip svg{width:11px;height:11px;fill:currentColor;flex-shrink:0;}
.mchip__l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;}
.mchip__n{margin-left:auto;font-size:12px;font-weight:600;color:var(--sage);}
.mchip .bdot{width:7px;height:7px;border-radius:50%;background:var(--dot);flex-shrink:0;}
.mchip--closed{--mc:#8FA37E;color:#CBD8C4;}
.mchip--adj{--mc:var(--orange);color:#FFD9AE;}
.mchip--busy{--mc:#C9A227;}
.mchip--prod{--mc:var(--lime);color:#DCEBBF;}
.mchip--media{--mc:#E8467C;color:#F3CBDA;}
.mchip--social{--mc:#35B79A;color:#BFE7DC;}
.mev[data-tip]{cursor:help;}
.mev__t{font-weight:700;font-size:15px;color:#fff;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
.mline{display:flex;align-items:flex-start;gap:5px;margin-top:2px;font-weight:600;font-size:13px;color:var(--sage);}
.mline svg{margin-top:2px;}
.mline svg{width:13px;height:13px;fill:var(--sage);flex-shrink:0;}
.mline span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;line-height:1.25;}
.mline--adj{color:#FFB469;}
.mline--busy{color:var(--sage);align-items:center;}
.mline--busy b{color:#EAF2E6;font-weight:700;}
.bdot{width:7px;height:7px;border-radius:50%;background:var(--dot);flex-shrink:0;display:inline-block;}
.qbusy{display:inline-flex;align-items:center;gap:6px;color:var(--sage);font-weight:600;}
.qbusy svg.ic{width:12px;height:12px;fill:currentColor;}
.mline--adj svg{fill:#FFB469;}
.mev__more{font-weight:600;font-size:13px;color:var(--sage-dim);}
.monthv .std{background:transparent;border:none;padding:6px 0 0;gap:8px 34px;border-top:1px solid var(--hair-soft);border-radius:0;}
.monthv .std__item{font-size:16px;color:var(--sage);}
.monthv .std__lock svg{width:14px;height:14px;}
.monthv .sechead{display:none;}
.rl{white-space:nowrap;}
.rl .flg{width:19px;height:13px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.2);display:inline-block;vertical-align:-2px;margin-right:4px;}
.rl__sep{opacity:.5;margin:0 2px;}
.mcd__n--hol{border-bottom:1px dotted rgba(255,255,255,.45);padding-bottom:1px;cursor:help;}
.qcd__n--hol{border-bottom:1px dotted rgba(255,255,255,.4);padding-bottom:1px;}
.gc--hol{box-shadow:inset 0 -2px 0 rgba(255,255,255,.16);}
.prodstrip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;}
/* labelled strip above the grid; the row keeps its height on a week without launches so
   the grid below it stays put */
.wprod{display:flex;align-items:center;gap:18px;height:40px;}
.wprod .prodstrip{flex-wrap:nowrap;min-width:0;}
.wprod__h{font-weight:700;text-transform:uppercase;letter-spacing:.15em;font-size:14px;
  color:var(--sage-dim);white-space:nowrap;}
.prodstrip--none{color:var(--sage-dim);font-weight:600;font-size:15px;}
.prod{display:inline-flex;align-items:center;gap:8px;background:rgba(162,186,28,.13);
  border:1px solid rgba(162,186,28,.35);border-radius:999px;padding:4px 13px;cursor:help;}
.prod__ic{font-size:17px;line-height:1;}
.prod b{font-weight:700;font-size:19px;color:#EAF3DE;}
.prod em{font-style:normal;font-weight:600;font-size:16px;color:var(--sage);}
.prod--period{background:rgba(162,186,28,.08);}
.mev--prod .mev__t{color:var(--lime);}
.mline--prod{color:var(--sage-dim);font-size:12px;}
.qdot--prod{background:var(--lime);left:calc(50% + 7px);}
.qdot--social{background:#35B79A;left:calc(50% + 14px);}
.ndot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;vertical-align:middle;}
.ndot--social{background:#35B79A;}
.mev--social .mev__t{color:#BFE7DC;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mev--social .sflags{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:5px;}
.mev--social .sflags svg.flg{width:11px;height:8px;border-radius:1px;}
.mev__more--social{color:#8FBDB0;}
.qev--promo .qev__t{color:#F0DCA8;}
.qev--social .qev__t{color:#BFE7DC;}
.qev--social .sflags{display:inline-flex;gap:2px;margin-right:6px;vertical-align:-1px;}
.qev--social .sflags svg.flg{width:12px;height:8px;border-radius:1px;}
.qev--prod .qev__t{color:#DCEBBF;}
.qev__sep{font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--sage-dim);margin-top:6px;}
.stage--narrow .prod b{font-size:16px;}
.stage--narrow .prod em{font-size:14px;}
/* ---------- media planning + filter ---------- */
.filterwrap{position:relative;display:inline-block;}
.mbtn--filter{border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 16px;color:var(--sage);}
.mbtn--filter-on{color:#1B2B1F;background:var(--orange);border-color:var(--orange);}
.mbtn--filter-on:hover{background:#ff9326;color:#1B2B1F;}
.fdrop{position:absolute;top:calc(100% + 8px);right:0;min-width:220px;background:#0B1F14;
  border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:8px;display:none;z-index:20;
  box-shadow:0 16px 40px rgba(0,0,0,.5);}
.fdrop--open{display:block;}
.fopt{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;cursor:pointer;
  font-weight:600;font-size:17px;color:#EAF2E6;line-height:1.25;}
.fopt>span{flex:1;min-width:0;}
.fopt:hover{background:rgba(255,255,255,.06);}
.fopt input{accent-color:var(--orange);width:17px;height:17px;flex:0 0 17px;align-self:center;margin:0;}
.fopt--off{color:var(--sage-dim);cursor:default;}
.fopt--off:hover{background:none;}
.fopt em{font-style:normal;font-size:14px;color:var(--sage-dim);margin-left:4px;}
.mediapill{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:4px 14px;cursor:help;}
.mediapill b{font-weight:700;font-size:18px;color:#EAF2E6;}
.mediapill em{font-style:normal;font-weight:600;font-size:15px;color:var(--sage);}
.dotc{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--sage);}
.dotc--NL{background:#FF8000;} .dotc--DE{background:#7FB4E8;} .dotc--UK{background:#C58CE0;}
.dotc--BE{background:#E8C24A;}
.mev__more{cursor:help;}
.qev--media .qev__t{display:inline-flex;align-items:center;gap:7px;color:#E4EDE0;}
.qev--media .qev__d{color:var(--sage-dim);width:96px;}
.stage--narrow .mediapill b{font-size:15px;}
.stage--narrow .mediapill em{font-size:13px;}
/* ---------- media campaign bars ---------- */
/* one line, always: the flag and the label sit next to each other as inline boxes, so
   without nowrap a long partner name pushed the label to a second line and made that
   media row taller than the others */
.mbrname{vertical-align:middle;white-space:nowrap;}
.mbrname__x{display:inline-flex;align-items:baseline;gap:10px;vertical-align:middle;line-height:1.2;min-width:0;
  flex-wrap:nowrap;max-width:calc(100% - 42px);}
.mbrname .grname{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mbrsub{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--sage);white-space:nowrap;}
.mbrsub .cdot{width:7px;height:7px;border-radius:50%;background:var(--mc);flex-shrink:0;}
.mbrsub svg.flg{width:15px;height:10px;border-radius:2px;}
.mbr--plain{height:17px;padding:0 10px;justify-content:center;
  background:color-mix(in srgb,var(--mc) 26%,transparent);border-left:none;}
.mbr__d{font-weight:600;font-size:12px;color:#EAF2E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mbrname .gflag{vertical-align:middle;}
.mbrname .gflag .flg{width:22px;height:15px;}
tr.mbrrow .mbrmore{color:var(--sage-dim);font-weight:600;font-size:14px;padding-left:2px;}
.mbrrow td{padding:0 2px 4px;}
/* the media section always occupies the same number of rows, so stepping through weeks
   never moves the grid above it: empty rows fill the remainder, and a week without
   campaigns says so instead of collapsing */
tr.mbrrow{height:27px;}
tr.mbrrow--pad td{padding:0;}
tr.mbrempty td{color:var(--sage-dim);font-weight:600;font-size:15px;padding-left:2px;}
.mbrspacer td{height:8px;border:none;padding:0;}
.mbrhead td{border-top:1px solid rgba(255,255,255,.10);padding:7px 0 3px;}
.mbrhead span{font-weight:700;text-transform:uppercase;letter-spacing:.15em;font-size:13px;color:var(--sage-dim);}
.grid tbody tr.mbrhead{border-top:none;}
.grid tbody tr.mbrrow,.grid tbody tr.mbrspacer{border-top:none;}
.mbrlead,.mcw--bar{background:transparent;border:none;}
.mbrgap{background:transparent;}
.mbr{position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  height:23px;padding:0 12px;border-radius:8px;cursor:help;
  background:color-mix(in srgb,var(--mc,#8FA37E) 20%,transparent);
  border-left:3px solid var(--mc,#8FA37E);}
.mbr__t{font-weight:700;font-size:15px;color:#F2F6EF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.15;}
.mbr__s{display:flex;align-items:center;gap:5px;font-weight:600;font-size:12px;color:var(--sage);
  white-space:nowrap;overflow:hidden;line-height:1.15;}
.mbr__s svg.flg{width:14px;height:10px;border-radius:2px;}
.mbr--contL{border-left:none;border-top-left-radius:0;border-bottom-left-radius:0;
  box-shadow:inset 3px 0 0 color-mix(in srgb,var(--mc,#8FA37E) 45%,transparent);}
.mbr--contR{border-top-right-radius:0;border-bottom-right-radius:0;}
.mbr--contL.mbr--contL.mbr--contL.mbrmore{font-weight:600;font-size:13px;color:var(--sage-dim);padding-left:12px;}
/* short bars: the partner name wins, the sub-line is dropped */
.mbrrow--month .mbr{height:19px;padding:0 9px;}
.mbrrow--month .mbr__t{font-size:12px;}
.mbrrow--month .mbr__s{display:none;}
.mbr[data-span="1"] .mbr__s,.mbr[data-span="2"] .mbr__s{display:none;}
/* a social post gets a taller card: title on top, then the markets as flags and the channel
   per platform. SOCIAL_ICONS is where the official channel PNGs go (base64 data URI); until
   they are in, the channel shows as a coloured dot with its name. */
.mbr--social[data-span="1"] .mbr__s,.mbr--social[data-span="2"] .mbr__s{display:flex;}
.mbr--social{padding:0 8px;}
.mbr--social .mbr__t{font-size:14px;margin-bottom:3px;}
.mbr--social .mbr__s{gap:6px;margin-top:auto;font-size:11px;}
.mbr--social .mbr__s svg.flg{width:13px;height:9px;}
.mbr--social .sflags{display:inline-flex;gap:2px;align-items:center;}
.mbr--social .schan{display:inline-flex;gap:5px;align-items:center;color:#BFE7DC;font-weight:700;}
.mbr--social .schan__i{display:inline-flex;align-items:center;gap:3px;}
.mbr--social .schan img{width:13px;height:13px;border-radius:3px;display:block;}
.mbr--social .mbr__s .flg--txt{font-size:8px;min-width:14px;}
.mbr--social .cdot{width:6px;height:6px;border-radius:50%;background:var(--mc);flex-shrink:0;}
.mbr--social .cdot--none{background:var(--sage-dim);}
.mbr--promo .mbr__t{letter-spacing:.01em;}
.mbr--promo .mbr__s{display:none;}
/* 23px keeps a social row exactly as tall as an empty one, so a week with posts
   does not shift the grid by a pixel */
.mbr--social{height:46px;padding:5px 9px;justify-content:flex-start;}
tr.mbrrow--socrow{height:50px;}
.mbrlead{}
.clg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.clg .flg{width:17px;height:12px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.18);}
.flg--txt{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:9px;
  letter-spacing:.04em;color:#0F241A;background:var(--sage);border-radius:2px;padding:0 3px;min-width:20px;}
.clg svg.ic{width:12px;height:12px;fill:currentColor;}
.mline--closed .clg>span{white-space:normal;}
.mbrrow--mini td{padding:0 1px 2px;}
.mbrrow--mini .mbr{height:6px;padding:0;border-radius:3px;border-left-width:0;}
.mbrrow--mini .mbr__t,.mbrrow--mini .mbr__s{display:none;}
.mbrrow--mini .mbr--NL{background:#FF8000;} .mbrrow--mini .mbrrow--mini .mbr--UK{background:#C58CE0;} .mbrrow--mini .mbrrow--mini .mbrmore{font-size:10px;padding-left:2px;}
.mseg{position:absolute;left:0;right:0;height:2px;background:var(--mc);
  bottom:calc(3px + var(--lane) * 4px);opacity:.9;}
.mseg--s{left:2px;border-top-left-radius:2px;border-bottom-left-radius:2px;}
.mseg--e{right:2px;border-top-right-radius:2px;border-bottom-right-radius:2px;}
.mseg--s::before,.mseg--e::after{content:"";position:absolute;top:-2px;width:6px;height:6px;
  border-radius:50%;background:var(--mc);}
.mseg--s::before{left:-2px;}
.mseg--e::after{right:-2px;}
.qcd{padding-bottom:13px;}
/* ---------- quarter view ---------- */
.qcols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;align-items:start;}
#quarterv>#q-grid{flex:1;min-height:0;overflow:hidden;}
.qm__title{font-weight:700;font-size:23px;color:#fff;margin-bottom:8px;}
.qcal{width:100%;border-collapse:collapse;table-layout:fixed;}
.qcal th{font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--sage-dim);padding:0 0 6px;text-align:center;}
.qcw{width:34px;font-weight:700;font-size:11px;line-height:1;color:var(--sage-dim);text-align:left;vertical-align:middle;}
td.qcw{padding:0;}
.qcd{text-align:center;vertical-align:middle;height:36px;position:relative;}
.qcal tbody tr{height:36px;}
.qcd__n{font-weight:600;font-size:14px;line-height:1;color:#D9E4D5;}
.qcd--past .qcd__n{opacity:.35;}
.qcd--today .qcd__n{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;
  line-height:1;border-radius:50%;background:var(--orange);color:#1B2B1F;font-weight:700;}
.qdot{position:absolute;left:50%;transform:translateX(-50%);bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--orange);}
.qcd--past .qdot{opacity:.4;}
.qm__list{margin-top:10px;border-top:1px solid var(--hair-soft);padding-top:8px;display:flex;flex-direction:column;gap:4px;}
.qev{display:flex;gap:10px;align-items:baseline;font-size:15px;color:#E4EDE0;font-weight:600;line-height:1.3;}
.qev__d{flex-shrink:0;width:96px;font-weight:700;color:var(--lime);font-size:13px;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qev__t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qev__t svg{width:12px;height:12px;fill:var(--sage);vertical-align:-1px;margin-right:3px;}
.qev--more,.qev--none{color:var(--sage-dim);font-weight:600;}
/* ---------- agenda board (holidays view) ---------- */
.agcols{display:grid;grid-template-columns:1fr 1fr;gap:11px 38px;align-items:start;}
.agcol{display:flex;flex-direction:column;gap:11px;min-width:0;}
.wkdiv{display:flex;align-items:center;gap:14px;margin:4px 0 0;}
.wkdiv__label{font-weight:700;text-transform:uppercase;letter-spacing:.15em;font-size:19px;color:var(--lime);white-space:nowrap;}
.wkdiv__range{font-weight:600;font-size:18px;color:var(--sage-dim);white-space:nowrap;letter-spacing:.05em;}
.wkdiv::after{content:"";flex:1;height:1px;background:var(--hair-soft);}
.agrow{display:flex;align-items:center;gap:20px;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:14px;padding:10px 22px 10px 10px;}
.datebox{width:86px;flex-shrink:0;background:var(--card);border-radius:10px;text-align:center;
  padding:6px 4px 7px;box-shadow:0 8px 20px rgba(0,0,0,.25);}
.datebox__day{font-weight:700;font-size:30px;line-height:1;color:var(--ink);}
.datebox__sub{font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--orange-ink);text-transform:uppercase;margin-top:3px;}
.agrow__main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
.agrow__title{font-weight:700;font-size:28px;line-height:1.05;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.agrow__title .card__icon{font-size:25px;}
.agrow__grp{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.agrow .tag{font-size:19px;padding:4px 11px;}
.agrow .tag .ic{width:18px;height:18px;}
.agrow .room{color:#F2F6EF;font-size:22px;}
.agrow .room__cc{background:rgba(255,255,255,.16);}
.agrow .tag--closed{color:#DCE5DA;background:rgba(255,255,255,.10);}
.agrow .tag--closed .ic{fill:#DCE5DA;}
.agrow .tag--normal{color:#CFDCCB;background:rgba(255,255,255,.08);}
.agrow .tag--adj{color:#FFB469;background:rgba(255,128,0,.16);}
.std{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;
  padding:18px 24px;display:flex;flex-wrap:wrap;gap:12px 40px;}
.std__item{display:inline-flex;align-items:center;gap:10px;font-weight:500;font-size:23px;color:#E4EDE0;}
.std__lock{display:inline-flex;}
.std__lock svg{width:18px;height:18px;fill:var(--sage);}
.std__sig{font-weight:700;color:var(--sage);}
.chip--off{opacity:.55;}
.chip__lockic{display:inline-flex;flex-shrink:0;}
.chip__lockic svg{width:15px;height:15px;fill:var(--sage);}
.card{background:var(--card);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.30);
  padding:22px 26px;overflow:hidden;}
.card__top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--hair);}
.card__title{font-weight:700;font-size:28px;line-height:1.05;color:var(--ink);}
.card__icon{font-size:26px;margin-left:2px;}
.card__date{font-weight:600;font-size:21px;color:var(--muted);white-space:nowrap;}

.grps{display:flex;flex-direction:column;gap:12px;}
.grp{display:flex;align-items:flex-start;gap:16px;}
.grp__tags{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.tag{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:20px;
  padding:6px 13px;border-radius:9px;white-space:nowrap;flex-shrink:0;min-width:60px;justify-content:center;}
.tag .ic{width:20px;height:20px;}
.tag--closed{color:var(--closed-ink);background:rgba(69,83,73,.10);}
.tag--adj{color:var(--orange-ink);background:rgba(255,128,0,.12);font-variant-numeric:tabular-nums;}
.tag--normal{color:var(--closed-ink);background:rgba(15,36,26,.07);}
.tag--crowd{color:var(--ink);background:color-mix(in srgb,var(--dot) 13%,transparent);}
.tag--crowd .rdot{width:15px;height:15px;}
.grp__rooms{display:flex;flex-wrap:wrap;gap:8px 10px;padding-top:3px;}
.room{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:22px;color:var(--ink);}
.room:not(:last-child)::after{content:"";}
.room__cc{font-weight:700;font-size:14px;letter-spacing:.06em;color:#fff;background:var(--ink);
  padding:2px 7px;border-radius:6px;}
.rdot{width:14px;height:14px;border-radius:50%;background:var(--dot);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--dot) 24%,transparent);}

/* ---------- open-as-usual chips ---------- */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
.chip{display:flex;align-items:center;gap:11px;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:11px;padding:12px 15px;}
.chip__dot{width:12px;height:12px;border-radius:50%;background:var(--dot,var(--lime));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--dot,var(--lime)) 26%,transparent);flex-shrink:0;}
.chip__name{font-weight:600;font-size:22px;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip__cc{font-weight:700;font-size:14px;letter-spacing:.08em;color:var(--sage);}

/* ---------- all-open hero (a week with no changes) ---------- */
.hero{display:flex;align-items:center;gap:20px;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:16px;padding:30px 34px;margin-bottom:26px;}
.hero__ic{width:64px;height:64px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--lime) 20%,transparent);}
.hero__ic svg{width:38px;height:38px;stroke:var(--lime);stroke-width:2.6;fill:none;}
.hero__t{font-weight:700;font-size:34px;color:#fff;}
.hero__s{font-weight:500;font-size:23px;color:var(--sage);margin-top:5px;}

/* ---------- footer ---------- */
.foot{display:none;justify-content:space-between;align-items:center;padding:18px 2px 0;}
.foot .legend,.foot .foot__brand{display:none;}
.foot__note{font-weight:500;font-size:19px;color:var(--sage-dim);display:flex;align-items:center;gap:10px;}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--lime);animation:pulse 2.6s ease-out infinite;}
.foot__brand{font-weight:600;font-size:18px;letter-spacing:.08em;color:var(--sage-dim);text-transform:uppercase;}
.legend{display:flex;gap:22px;}
.lg{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:18px;color:var(--sage-dim);}
.lg--label{text-transform:uppercase;letter-spacing:.12em;font-size:15px;margin-right:2px;}
.lg i{width:12px;height:12px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--dot) 24%,transparent);}
.brandbar{height:6px;background:linear-gradient(90deg,var(--orange),#ffab52);border-radius:3px;margin-top:13px;}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lime) 55%,transparent);}70%{box-shadow:0 0 0 11px transparent;}100%{box-shadow:0 0 0 0 transparent;}}

.card,.hero{animation:rise .5s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.card,.hero{animation:none;}.pulse{animation:none;}}
</style>
</head>

              <label class="fopt"><input type="checkbox" data-f="products" checked><span>Product launches</span></label>

<script>
/* On-screen error reporting: any script error shows in the footer (useful on signage/RDP without devtools) */
function showErr(msg){
  try{
    var el=document.getElementById("updated");if(el)el.textContent="\u26A0 Script error: "+String(msg).slice(0,160);
    var f=document.querySelector(".foot");if(f)f.style.display="flex";
  }catch(e){}
}
window.onerror=function(msg,src,line){showErr(msg+" (line "+line+")");};
window.addEventListener("unhandledrejection",function(e){showErr(e.reason&&e.reason.message?e.reason.message:e.reason);});
/* ============================================================
   CONFIG
   ============================================================ */

function flagSVG(c){
  const k=countryBadgeTxt(c);
  if(FLAG_SVG[k])return FLAG_SVG[k];
  if(!k)return "";
  return '<span class="flg flg--txt">'+k+'</span>';   // unknown country: show the code, never nothing
}
/* Tooltips are plain text (data-tip), so a flag travels as the token [[flag:XX]] and the
   tooltip renderer swaps it for the drawn SVG. Empty country: no token, so no stray badge. */
function flagTok(c){
  const k=countryBadgeTxt(c).replace(/[\[\]]/g,"");
  return k?"[[flag:"+k+"]] ":"";
}
function tipAttr(s){return s?` data-tip="${String(s).replace(/"/g,"&quot;").replace(/\n/g,"&#10;")}"`:"";}

    const k=r[2]+"|"+r[0]+"|"+r[1];

/* Weekly footfall level per showroom, derived from the Dashboard CS ticket data.
   Measured for 2026 weeks 1-36; later weeks use last year's same week, otherwise the
   seasonal curve. Rooms without their own ticket data borrow the nearest comparable
   showroom (London<-Leicester, Bremen/Berlin<-Crailsheim, Munich<-Ingolstadt).
   A daily row in the forecast tab always wins over this weekly fallback. */
function forecastWeekLevel(d,room){
  const t=FORECAST_WEEK_DEFAULT[room];if(!t)return "";
  const l=t[isoWeek(d)];
  return l?FC_LETTER[l]:"";
}

/* Clip media flights to [from,to] (7 days) and stack them into lanes.
   Returns lanes: [[{col,span,m,contL,contR}, ...], ...] */
function mediaLanes(from,to,maxLanes){
  const items=[];
  MEDIA.forEach(function(r){
    const a=parseDate(r[0]),b=parseDate(r[1]);
    if(!a||!b||b<from||a>to)return;
    const sIdx=Math.max(0,Math.round((a-from)/DAY));
    const eIdx=Math.min(6,Math.round((b-from)/DAY));
    items.push({col:sIdx,span:eIdx-sIdx+1,contL:a<from,contR:b>to,
                m:{from:a,until:b,partner:r[2],land:r[3],kanaal:r[4]}});
  });
  items.sort(function(x,y){return (x.col-y.col)||(y.span-x.span);});
  const lanes=[];
  items.forEach(function(it){
    for(let i=0;i<lanes.length;i++){
      if(!lanes[i].some(function(o){return it.col < o.col+o.span && o.col < it.col+it.span;})){
        lanes[i].push(it);return;
      }
    }
    lanes.push([it]);
  });
  const shown=lanes.slice(0,maxLanes||3);
  const rest=[];
  lanes.slice(maxLanes||3).forEach(function(l){l.forEach(function(o){rest.push(o);});});
  rest.sort(function(a,b){return a.col-b.col;});
  return {lanes:shown,hidden:rest.length,
          hiddenTip:rest.map(function(o){
            return flagTok(o.m.land)+o.m.partner+": "+(o.m.kanaal||"channel unknown")+" \u00b7 "+mediaRangeLabel(o.m);
          }).join("\n")};
}
/* week view: one row per campaign, label in the left column, bar in the day columns.
   Every campaign renders the same structure, so a new partner needs no special handling:
   a missing channel or country simply shows a neutral placeholder. */
function mediaGanttRows(from,to,maxRows,cls,pad){
  const items=[];
  MEDIA.forEach(function(r){
    const a=parseDate(r[0]),b=parseDate(r[1]);
    if(!a||!b||b<from||a>to)return;
    items.push({col:Math.max(0,Math.round((a-from)/DAY)),
                span:Math.min(6,Math.round((b-from)/DAY))-Math.max(0,Math.round((a-from)/DAY))+1,
                contL:a<from,contR:b>to,
                m:{from:a,until:b,partner:(r[2]||"Unnamed campaign"),land:(r[3]||""),kanaal:(r[4]||"")}});
  });
  items.sort(function(x,y){return (x.col-y.col)||x.m.partner.localeCompare(y.m.partner);});
  /* With pad on, the section is always maxRows tall: one row goes to "+N more" when there
     are too many campaigns, and the remainder is filled with empty rows. */
  const cap=(pad&&items.length>maxRows)?maxRows-1:maxRows;
  const shown=items.slice(0,cap),rest=items.slice(cap);
  let html="";
  shown.forEach(function(it){
    const col=channelColor(it.m.kanaal);
    const flag=it.m.land?flagSVG(it.m.land):"";
    const sub=[it.m.kanaal||"Channel unknown"].join("");
    let row=`<td class="gc gc--room mbrname"${tipAttr(mediaTip(it.m))}>`+
            `<span class="gflag">${flag}</span>`+
            `<span class="mbrname__x"><span class="grname">${it.m.partner}</span>`+
            `<span class="mbrsub" style="--mc:${col}"><i class="cdot"></i>${sub}</span></span></td>`;
    if(it.col>0)row+=`<td colspan="${it.col}" class="mbrgap"></td>`;
    const edge=(it.contL?" mbr--contL":"")+(it.contR?" mbr--contR":"");
    row+=`<td colspan="${it.span}" class="mbrcell"><div class="mbr mbr--plain${edge}" style="--mc:${col}"${tipAttr(mediaTip(it.m))}>`+
         `<span class="mbr__d">${mediaRangeLabel(it.m)}</span></div></td>`;
    const after=7-(it.col+it.span);
    if(after>0)row+=`<td colspan="${after}" class="mbrgap"></td>`;
    html+=`<tr class="${cls}">${row}</tr>`;
  });
  if(rest.length){
    const tip=rest.map(function(o){return flagTok(o.m.land)+o.m.partner+": "+(o.m.kanaal||"channel unknown")+" \u00b7 "+mediaRangeLabel(o.m);}).join("\n");
    html+=`<tr class="${cls}"><td class="gc gc--room mbrmore"${tipAttr(tip)}>+${rest.length} more campaigns</td><td colspan="7"></td></tr>`;
  }
  if(pad){
    let used=shown.length+(rest.length?1:0);
    if(!used){html+=`<tr class="${cls} mbrempty"><td colspan="8">No campaigns this week</td></tr>`;used=1;}
    for(let i=used;i<maxRows;i++)html+=`<tr class="${cls} mbrrow--pad"><td colspan="8"></td></tr>`;
  }
  return html;
}
/* one <tr> per lane: leading cell + bar cells with colspan, aligned to the day columns */
function mediaLaneRows(from,to,leadCell,maxLanes,cls,noMore){
  const res=mediaLanes(from,to,maxLanes);
  let html="";
  res.lanes.forEach(function(lane){
    lane.sort(function(a,b){return a.col-b.col;});
    let row=leadCell,cur=0;
    lane.forEach(function(it){
      if(it.col>cur)row+=`<td colspan="${it.col-cur}" class="mbrgap"></td>`;
      const c=countryBadgeTxt(it.m.land);
      const col=channelColor(it.m.kanaal);
      const edge=(it.contL?" mbr--contL":"")+(it.contR?" mbr--contR":"");
      row+=`<td colspan="${it.span}" class="mbrcell"><div class="mbr${edge}" data-span="${it.span}" style="--mc:${col}"${tipAttr(mediaTip(it.m))}>`+
           `<span class="mbr__t">${it.m.partner}</span>`+
           `<span class="mbr__s">${it.m.kanaal} \u00b7 ${c}</span></div></td>`;
      cur=it.col+it.span;
    });
    if(cur<7)row+=`<td colspan="${7-cur}" class="mbrgap"></td>`;
    html+=`<tr class="${cls}">${row}</tr>`;
  });
  if(res.hidden&&!noMore)html+=`<tr class="${cls}">${leadCell}<td colspan="7" class="mbrmore"${tipAttr(res.hiddenTip)}>+${res.hidden} more campaigns</td></tr>`;
  return html;
}

function fcKey(d,room){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"|"+room;}

  // "10:00:00" -> "10:00", "9:5" -> "09:05"; leaves other text untouched
  const m=(t||"").trim().match(/^(\d{1,2}):(\d{1,2})(?::\d{1,2})?$/);
  if(!m)return (t||"").trim();

function parseDate(s){

  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(m){
    let day=+m[1],mon=+m[2];
    if(mon>12&&day<=12){const t=day;day=mon;mon=t;}   // tolerate US order (m/d/y)
    if(mon<1||mon>12||day<1||day>31)return null;
    return new Date(+m[3],mon-1,day);

/* Standard opening for a showroom on a date: {closed:bool, from, until} or null if no pattern. */
function standardHours(room,d){
  const pat=STANDARD[room]; if(!pat)return null;
  let v=(pat[(d.getDay()+6)%7]||"").trim();
  const lv=v.toLowerCase();
  if(lv===""||lv==="x"||lv==="dicht"||lv==="closed")return {closed:true};
  if(lv.indexOf("even")===0||lv.indexOf("oneven")===0||lv.indexOf("odd")===0){
    const odd=lv.indexOf("oneven")===0||lv.indexOf("odd")===0;
    const open= odd ? isoWeek(d)%2===1 : isoWeek(d)%2===0;
    if(!open)return {closed:true,alt:true};
    const rest=v.replace(/^(oneven|even|odd)/i,"").trim();

const DAY=86400000;
function fmtWhen(d){return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});}
function fmtRange(a,b){
  /* the year is always in the label: stepping ten weeks forward otherwise left you guessing
     which year you were looking at */
  const sameMonth=a.getMonth()===b.getMonth(),sameYear=a.getFullYear()===b.getFullYear();
  const left=a.toLocaleDateString("en-GB",{day:"numeric",
    month:(sameMonth&&sameYear)?undefined:"short",year:sameYear?undefined:"numeric"});
  const right=b.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  return `${left} \u2013 ${right}`;
}
function parseCSV(text){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else{if(ch==='"')q=true;else if(ch===',')row.push(cur),cur="";
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur="";}
      else if(ch==='\r'){}else cur+=ch;}}
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function rowsToObjects(rows){
  if(!rows.length)return[];
  const head=rows[0].map(h=>h.trim().toLowerCase());const idx=n=>head.indexOf(n);
  const pick=function(){for(var i=0;i<arguments.length;i++){const j=head.indexOf(arguments[i]);if(j>=0)return j;}return -1;};
  const iD=pick("date","datum"),iS=pick("showroom","vestiging"),iC=pick("country","land"),
        iSt=pick("status"),iF=pick("open from","van"),iU=pick("open until","tot"),
        iR=pick("reason","reden"),iCr=pick("crowd","drukte");
  return rows.slice(1).map(r=>({
    Date:(r[iD]||"").trim(),Showroom:(r[iS]||"").trim(),Country:(r[iC]||"").trim(),
    Status:(r[iSt]||"").trim(),OpenFrom:fmtTime(r[iF]),OpenUntil:fmtTime(r[iU]),
    Reason:(r[iR]||"").trim(),Crowd:(r[iCr]||"").trim()

}

const CROWD_RANK={quiet:1,low:1,rustig:1,moderate:2,medium:2,gemiddeld:2,busy:3,high:3,druk:3};

      if(v&&(CROWD_RANK[v.toLowerCase()]||0)>rank){rank=CROWD_RANK[v.toLowerCase()];best=v;}

function buildWeek(data,mon,resolve,lockDate){

  const names=new Set(items.map(i=>i.Showroom));
  const normals=SHOWROOMS.filter(s=>!names.has(s.name));
  const openLabel=(normals.length===SHOWROOMS.length?"all "+SHOWROOMS.length:normals.length+" of "+SHOWROOMS.length);

  if(!items.length){
    return `<div class="hero"><div class="hero__ic">${CHECK_SVG}</div>`+
           `<div><div class="hero__t">All showrooms open as usual</div>`+
           `<div class="hero__s">No special hours this week</div></div></div>`+
           openSectionHTML(SHOWROOMS,openLabel,resolve,lockDate);
  }
  // group items into events by date + reason
  const ev=new Map();
  items.forEach(it=>{const key=it.Date+"|"+(it.Reason||"");
    if(!ev.has(key))ev.set(key,{date:it.Date,reason:it.Reason||"",rows:[]});
    ev.get(key).rows.push(it);});
  const events=[...ev.values()].sort((a,b)=>parseDate(a.date)-parseDate(b.date));

function standardSummaryHTML(){

      if(v.indexOf("oneven")===0||v.indexOf("odd")===0){parts.push(DAYN[i]+" (even weeks)");return;}

function buildHolidays(data){
  const today=todayDate();
  const base=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const until=addDays(base,42);
  const items=data.filter(it=>{const d=parseDate(it.Date);return d&&d>=base&&d<=until;});
  if(!items.length){
    return `<div class="hero"><div class="hero__ic">${CHECK_SVG}</div>`+
           `<div><div class="hero__t">No special days coming up</div>`+
           `<div class="hero__s">All showrooms open as usual for the next 6 weeks</div></div></div>`+
           standardSummaryHTML();
  }
  const ev=new Map();
  items.forEach(it=>{const key=it.Date+"|"+(it.Reason||"");
    if(!ev.has(key))ev.set(key,{date:it.Date,reason:it.Reason||"",rows:[]});
    ev.get(key).rows.push(it);});
  const events=[...ev.values()].sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  // group per week
  const byWeek=new Map();
  events.forEach(e=>{const m=mondayOf(parseDate(e.date));const k=m.getTime();
    if(!byWeek.has(k))byWeek.set(k,{mon:m,events:[]});byWeek.get(k).events.push(e);});
  const weeks=[...byWeek.values()].sort((a,b)=>a.mon-b.mon);
  const monThis=mondayOf(base);
  // flat item list (dividers + events) for near-equal column balancing
  const flat=[];
  weeks.forEach(w=>{
    const off=Math.round((w.mon-monThis)/(7*DAY));
    const label=off===0?"This week":off===1?"Next week":"Week "+isoWeek(w.mon);
    const div=`<div class="wkdiv"><span class="wkdiv__label">${label}</span><span class="wkdiv__range">${fmtRange(w.mon,addDays(w.mon,6))}</span></div>`;
    flat.push({html:div,weight:1,div:div,isDiv:true});
    w.events.forEach(e=>{
      const kinds=new Set(e.rows.map(r=>isClosed(r.Status)?"c":(isAdjusted(r.Status)||(r.OpenFrom&&r.OpenUntil))?("a|"+r.OpenFrom+"|"+r.OpenUntil):"n"));
      flat.push({html:agendaRowHTML(e),weight:2+(kinds.size-1),div:div,isDiv:false});
    });
  });
  const total=flat.reduce((s,i)=>s+i.weight,0);
  let acc=0,split=flat.length;
  for(let i=0;i<flat.length;i++){acc+=flat[i].weight;if(acc>=total/2){split=i+1;break;}}
  if(split<flat.length && flat[split-1] && flat[split-1].isDiv)split--;   // no orphan week header at column bottom
  const leftItems=flat.slice(0,split),rightItems=flat.slice(split);
  let right="";
  if(rightItems.length && !rightItems[0].isDiv)right+=rightItems[0].div;  // repeat week header when a week continues
  right+=rightItems.map(i=>i.html).join("");
  const left=leftItems.map(i=>i.html).join("");
  let html=`<div class="agcols"><div class="agcol">${left}</div><div class="agcol">${right}</div></div>`;
  html+=standardSummaryHTML();
  return html;
}
/* Effective schedule for one showroom on one date: merges standard hours with an exception override.
   Returns {closed, from, until, crowd, reason, isException}. */
function effectiveDay(room,country,d,exMap){
  const key=fcKey(d,room);
  const ex=exMap[key];
  if(ex){
    const hl=holidaysForRoom(d,room);
    if(isClosed(ex.Status))return {closed:true,reason:ex.Reason,isException:true,holidays:hl};
    if(isAdjusted(ex.Status)||(ex.OpenFrom&&ex.OpenUntil))
      return {closed:false,from:ex.OpenFrom,until:ex.OpenUntil,crowd:ex.Crowd,reason:ex.Reason,isException:true,holidays:hl};
    // Normal hours row: only an exception when the expected footfall differs from normal
    const st=standardHours(room,d)||{closed:false,from:"",until:""};
    const impact=rowHasImpact(ex);
    return {closed:!!st.closed,from:st.from,until:st.until,crowd:ex.Crowd,
            reason:impact?ex.Reason:"",isException:impact,holidays:hl};
  }
  const st=standardHours(room,d);
  if(!st)return {closed:false,from:"",until:"",unknown:true};
  const crowd=FORECAST[key]||forecastWeekLevel(d,room)||"";
  return {closed:!!st.closed,alt:!!st.alt,from:st.from,until:st.until,crowd:crowd,isException:false,holidays:holidaysForRoom(d,room)};
}

const QUIET_REASONS=[/no sunday opening/i];
const REGION_FULL={BW:"Baden-W\u00fcrttemberg",BY:"Bavaria",HB:"Bremen",BE:"Berlin",NRW:"North Rhine-Westphalia",
  NI:"Lower Saxony",HH:"Hamburg",SH:"Schleswig-Holstein",RP:"Rhineland-Palatinate",SL:"Saarland",
  SN:"Saxony",ST:"Saxony-Anhalt",TH:"Thuringia",MV:"Mecklenburg-Vorpommern",HE:"Hesse",BB:"Brandenburg"};
function fullReason(r){
  return String(r||"").replace(/\(([^)]+)\)/g,function(m,g){
    const k=g.trim().toUpperCase();
    return "("+(REGION_FULL[k]||g.trim())+")";

function displayReason(r){
  return String(r||"").replace(/\s*\([^)]*\)\s*$/,"").trim();
}
/* Local wording shouldn't split one day into two entries: "Monday after autumn holiday (BW)"
   and "Monday after autumn half-term" are the same event with a different name per market.
   Grouping happens on this key; the entry then carries the name used by the most showrooms
   and lists the other names in its hover. */
function reasonKey(r){
  return displayReason(r).toLowerCase()
    .replace(/half[-\s]?term/g,"holiday")
    .replace(/\bvacation\b/g,"holiday")
    .replace(/\bschool\b/g," ")
    .replace(/[^a-z0-9 ]/g," ")
    .replace(/\s+/g," ").trim();
}
/* pick the label most showrooms use, and describe the rest for the hover */
/* every line the board knows about a day's exceptions: the event, what it means, and the
   full explanation — used by the quarter dots now that the list under the calendar is gone */
function impactTipLines(items){
  const out=[],ev=new Map();
  items.filter(rowHasImpact).forEach(function(it){
    const key=reasonKey(it.Reason);
    if(!ev.has(key))ev.set(key,{rows:[]});
    ev.get(key).rows.push(it);
  });
  ev.forEach(function(e){
    const v=reasonVariants(e.rows);
    out.push(fullReason(v.reason)||"Special day");
    const closed=e.rows.filter(function(x){return isClosed(x.Status);});
    if(closed.length)out.push("Closed: "+roomList(closed,true));
    e.rows.filter(function(x){return !isClosed(x.Status)&&(isAdjusted(x.Status)||(x.OpenFrom&&x.OpenUntil));})
      .forEach(function(x){out.push("Adjusted: "+x.Showroom+" "+x.OpenFrom+"\u2013"+x.OpenUntil);});
    const busy={};
    e.rows.filter(function(x){return !isClosed(x.Status)&&!(isAdjusted(x.Status)||(x.OpenFrom&&x.OpenUntil));})
      .forEach(function(x){const cw=crowdInfo(x.Crowd);if(!cw)return;(busy[cw.label]=busy[cw.label]||[]).push(x);});
    Object.keys(busy).forEach(function(lbl){
      out.push("Expected: "+(lbl==="High"?"busier than usual":lbl.toLowerCase()+" footfall")+" \u2014 "+roomList(busy[lbl],true));
    });
    (v.lines||[]).forEach(function(x){out.push(x);});

}
function reasonVariants(rows){
  const by={};
  rows.forEach(function(x){const v=displayReason(x.Reason)||"";(by[v]=by[v]||[]).push(x);});
  const names=Object.keys(by);
  let best=names[0]||"",n=-1;
  names.forEach(function(v){if(by[v].length>n){n=by[v].length;best=v;}});
  const lines=names.length>1?names.map(function(v){
    return "Called \""+v+"\" in "+roomList(by[v],true);
  }):[];
  return {title:best,reason:(by[best][0]||{}).Reason||"",lines:lines};
}

function fitSched(){
  const wrap=document.getElementById("sched");if(!wrap||wrap.style.display==="none")return;
  const inner=document.getElementById("sched-inner");
  inner.style.transform="none";
  /* what is left for the table after the bar and the product strip above it — measuring
     against the whole container let the lowest section run off the screen */
  const top=inner.getBoundingClientRect().top-wrap.getBoundingClientRect().top;
  const avail=Math.max(120,wrap.clientHeight-top),need=inner.scrollHeight;
  const k=need>avail+1?avail/need:1;
  inner.style.transform="scale("+k+")";inner.style.transformOrigin="top center";
}
/* The quarter lists render in full; this trims only what actually runs past the bottom of
   the column, so a month with room shows everything. */
function fitQuarterLists(){
  const wrap=document.getElementById("quarterv");
  if(!wrap||wrap.style.display==="none")return;
  const limit=wrap.getBoundingClientRect().bottom-4;
  wrap.querySelectorAll(".qm__list").forEach(function(list){
    list.querySelectorAll(".qev--fitmore").forEach(function(e){e.remove();});
    const rows=[].slice.call(list.children);
    rows.forEach(function(r){r.style.display="";});
    let cut=-1;
    for(let i=0;i<rows.length;i++){
      if(rows[i].getBoundingClientRect().bottom>limit){cut=i;break;}
    }
    if(cut<0)return;
    if(cut>0)cut--;                       // the "+N more" line needs a row of its own
    const hidden=rows.slice(cut);
    hidden.forEach(function(r){r.style.display="none";});
    const lines=hidden.filter(function(r){return r.hasAttribute("data-fit");})
                      .map(function(r){return r.getAttribute("data-fit");});
    if(!lines.length)return;
    const el=document.createElement("div");
    el.className="qev qev--more qev--fitmore";
    el.textContent="+"+lines.length+" more";
    el.setAttribute("data-tip",lines.join("\n"));
    list.appendChild(el);
  });
}
function fitColumns(){
  const fits=[...document.querySelectorAll(".fit")];if(!fits.length)return;
  fits.forEach(f=>{f.style.transform="none";f.style.width="100%";});
  let k=1;
  fits.forEach(f=>{const avail=f.parentElement.clientHeight,need=f.scrollHeight;if(need>avail+1)k=Math.min(k,avail/need);});
  if(k<1)fits.forEach(f=>{f.style.width=(100/k)+"%";f.style.transform="scale("+k+")";});
}

const FETCH_TIMEOUT_MS = 6000;   // never wait longer than this per CSV
let LAST_GOOD_DATA = null;       // keep last successful exceptions so a hiccup doesn't blank the board
function fetchTimeout(url,ms){
  if(typeof AbortController==="undefined")return fetch(url,{cache:"no-store"});
  const ctl=new AbortController();
  const t=setTimeout(function(){ctl.abort();},ms);
  const p=fetch(url,{cache:"no-store",signal:ctl.signal});
  p.then(function(){clearTimeout(t);},function(){clearTimeout(t);});
  return p;
}
function settle(p){return p.then(function(v){return{status:"fulfilled",value:v};},function(e){return{status:"rejected",reason:e};});}
async function loadForecast(){
  const map={};
  if(!FORECAST_CSV_URL){
    const demoT=DEMO_TODAY?parseDate(DEMO_TODAY):null;
    if(demoT){
      const m=mondayOf(demoT);
      for(let i=0;i<14;i++){const d=addDays(m,i);
        SHOWROOMS.forEach(s=>{map[fcKey(d,s.name)]=SAMPLE_FORECAST[s.name]||"Quiet";});}
    }
    return map;
  }
  const r=await fetchTimeout(FORECAST_CSV_URL,FETCH_TIMEOUT_MS);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const rows=parseCSV(await r.text());
  if(!rows.length)return map;
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const iD=head.indexOf("date"),iS=head.indexOf("showroom"),iC=head.indexOf("crowd");
  if(iD<0||iS<0||iC<0)throw new Error("Forecast CSV mist kolommen Date/Showroom/Crowd");
  rows.slice(1).forEach(row=>{
    const d=parseDate(row[iD]);if(!d)return;
    map[fcKey(d,(row[iS]||"").trim())]=(row[iC]||"").trim();
  });
  return map;
}

async function loadStandard(){
  if(!STANDARD_CSV_URL)return STANDARD_DEFAULT;
  const r=await fetchTimeout(STANDARD_CSV_URL,FETCH_TIMEOUT_MS);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const rows=parseCSV(await r.text());
  if(rows.length<2)return STANDARD_DEFAULT;
  const head=rows[0].map(h=>(h||"").trim().toLowerCase());
  const DAYS=[["ma","mon","maandag","monday"],["di","tue","dinsdag","tuesday"],["wo","wed","woensdag","wednesday"],
              ["do","thu","donderdag","thursday"],["vr","fri","vrijdag","friday"],["za","sat","zaterdag","saturday"],
              ["zo","sun","zondag","sunday"]];
  const iRoom=head.findIndex(h=>h==="showroom"||h==="vestiging");
  const dayIdx=DAYS.map(alts=>head.findIndex(h=>alts.indexOf(h)>=0));
  const out={};
  if(iRoom>=0 && !dayIdx.some(i=>i<0)){
    // row format: Showroom | Ma..Zo
    rows.slice(1).forEach(r2=>{
      const name=(r2[iRoom]||"").trim();if(!name)return;
      out[name]=dayIdx.map(i=>normStd(r2[i]));
    });
  }else{
    // block format: per showroom three columns (label | van | tot), day names as rows
    const known={};SHOWROOMS.forEach(s=>known[s.name.toLowerCase()]=s.name);
    const dayRow={};
    rows.forEach((r2,ri)=>{
      const lbl=(r2[0]||"").trim().toLowerCase();
      DAYS.forEach((alts,di)=>{if(alts.indexOf(lbl)>=0)dayRow[di]=ri;});
    });
    // find day rows by scanning all label columns (block labels repeat per block)
    const labelCols=[];
    (rows[0]||[]).forEach((cell,ci)=>{
      const nm=known[(cell||"").trim().toLowerCase()];
      if(nm)labelCols.push({col:ci,name:nm});
    });
    labelCols.forEach(({col,name})=>{
      const pat=["","","","","","",""];
      rows.forEach(r2=>{
        const lbl=(r2[col]||"").trim().toLowerCase();
        DAYS.forEach((alts,di)=>{
          if(alts.indexOf(lbl)>=0){
            const from=(r2[col+1]||"").trim(),until=(r2[col+2]||"").trim();
            pat[di]=normStdPair(from,until);
          }
        });
      });
      out[name]=pat;
    });
  }
  if(!Object.keys(out).length)return STANDARD_DEFAULT;
  // rooms missing from the sheet keep the built-in pattern
  SHOWROOMS.forEach(s=>{if(!out[s.name])out[s.name]=STANDARD_DEFAULT[s.name]||["","","","","","",""];});
  return out;
}
function normStd(v){
  v=(v||"").trim();
  const lv=v.toLowerCase();
  if(lv==="om de week")return "even";
  return v;
}
function normStdPair(from,until){
  const lf=from.toLowerCase(),lu=until.toLowerCase();
  if(lf==="om de week"||lu==="om de week")return "even";
  if(/^(even|oneven|odd)$/.test(lf))return from;
  const f=fmtTime(from),u=fmtTime(until);
  if(/^\d{2}:\d{2}$/.test(f)&&/^\d{2}:\d{2}$/.test(u))return f+"-"+u;
  return "";   // empty or unparsable = closed
}

  const fc=results[0],ex=results[1],st=results[2],hd=results[3],pr=results[4];

  if(CSV_URL && ex.status!=="fulfilled"){problems.push("hours");console.warn("Hours CSV:",ex.reason);}
  if(STANDARD_CSV_URL && st.status!=="fulfilled"){problems.push("standard");console.warn("Standard CSV:",st.reason);}
  if(HOLIDAY_CSV_URL && hd.status!=="fulfilled"){problems.push("holidays");console.warn("Holiday CSV:",hd.reason);}

  try{render(data,problems);}catch(err){showErr(err.message||err);throw err;}
  if(problems.length && !retryTimer){retryTimer=setTimeout(function(){retryTimer=null;refresh();},60000);}
}

function fitStage(){
  /* Responsive canvas: the stage always fills the viewport exactly (no black bars at any
     aspect ratio). Typography stays legible because the scale factor has a floor; below
     that the canvas simply gets more logical pixels and the layout reflows. */
  const cw=document.documentElement.clientWidth||window.innerWidth;
  const ch=document.documentElement.clientHeight||window.innerHeight;
  const raw=Math.min(cw/1920,ch/1080);
  const k=Math.min(1,Math.max(0.62,raw));
  const st=document.getElementById("stage");
  const w=Math.round(cw/k), h=Math.round(ch/k);
  st.style.width=w+"px";
  st.style.height=h+"px";
  st.style.transform="scale("+k+")";
  st.classList.toggle("stage--narrow",w<1500);
  st.classList.toggle("stage--tight",h<820);
  st.classList.toggle("stage--phone",w<820);
}
/* tooltips: one element, positioned near the target and clamped inside the window */
(function(){
  const tip=document.getElementById("tip");
  let cur=null;
  let mx=0,my=0;
  function place(el){
    const txt=el.getAttribute("data-tip");
    if(!txt){hide();return;}
    const esc=function(x){return x.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");};
    /* [[flag:XX]] -> drawn flag. Only the whitelisted codes become an SVG; anything else
       becomes a code badge, so an unknown country still shows something. */
    const flags=function(x){return x.replace(/\[\[flag:([^\]]{1,24})\]\]/g,function(_,c){
      return FLAG_SVG[c]||'<span class="flg flg--txt">'+c+'</span>';
    });};
    tip.innerHTML=String(txt).split("\n").map(function(line){
      const i=line.indexOf(": ");
      const body=i>0?("<b>"+flags(esc(line.slice(0,i+1)))+"</b> "+flags(esc(line.slice(i+2)))):flags(esc(line));
      return '<span class="tl">'+body+'</span>';
    }).join("");
    tip.classList.add("tip--on");
    const r=el.getBoundingClientRect();
    const tw=tip.offsetWidth, th=tip.offsetHeight;
    const vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight;
    /* wide targets (campaign bars, week rows): follow the cursor, else centre on the element */
    const wide=r.width>320;
    let x=wide?(mx-tw/2):(r.left+r.width/2-tw/2);
    x=Math.max(8,Math.min(x,vw-tw-8));
    let y=(wide?my:r.top)-th-12;
    if(y<8)y=Math.min((wide?my:r.bottom)+14,vh-th-8);
    tip.style.left=Math.round(x)+"px";
    tip.style.top=Math.round(y)+"px";
    cur=el;
  }
  function hide(){tip.classList.remove("tip--on");cur=null;}
  document.addEventListener("mousemove",function(e){
    mx=e.clientX;my=e.clientY;
    const el=e.target.closest?e.target.closest("[data-tip]"):null;
    if(el){
      const r=el.getBoundingClientRect();
      if(el!==cur||r.width>320)place(el);
    }else if(cur)hide();
  });
  document.addEventListener("mouseleave",function(e){
    if(cur&&e.target===cur)hide();
  },true);
  window.addEventListener("scroll",hide,true);
  window.addEventListener("resize",hide);
})();

initNav();
/* instant first paint: show the grid with standard hours while the CSVs load */
if(VIEW!=="holidays"){try{render([],[]);}catch(e){console.warn("first paint:",e);}}
(function(){
  const rerender=function(){if(LAST_RENDER_DATA)render(LAST_RENDER_DATA,LAST_PROBLEMS);};
  // filter dropdowns (one per view bar)
  document.querySelectorAll(".mbtn--filter").forEach(function(btn){
    const drop=btn.parentElement.querySelector(".fdrop");
    btn.onclick=function(e){
      e.stopPropagation();
      const open=drop.classList.contains("fdrop--open");
      document.querySelectorAll(".fdrop").forEach(function(d){d.classList.remove("fdrop--open");});
      if(!open)drop.classList.add("fdrop--open");
    };
    drop.onclick=function(e){e.stopPropagation();};
    drop.querySelectorAll("input[data-f]").forEach(function(inp){
      inp.onchange=function(){
        FILTERS[inp.getAttribute("data-f")]=inp.checked;
        syncFilterURL();
        document.querySelectorAll('.fdrop input[data-f="'+inp.getAttribute("data-f")+'"]').forEach(function(o){o.checked=inp.checked;});
        document.querySelectorAll(".mbtn--filter").forEach(function(b){b.classList.toggle("mbtn--filter-on",FILTERS.media&&FILTERS.hours&&FILTERS.products);});
        rerender();
      };
    });
    btn.classList.toggle("mbtn--filter-on",FILTERS.media&&FILTERS.hours&&FILTERS.products);
  });
  document.addEventListener("click",function(){document.querySelectorAll(".fdrop").forEach(function(d){d.classList.remove("fdrop--open");});});
  const pv=document.getElementById("month-prev"),nx=document.getElementById("month-next"),td=document.getElementById("month-today");
  if(pv)pv.onclick=function(){MONTH_OFFSET--;rerender();};
  if(nx)nx.onclick=function(){MONTH_OFFSET++;rerender();};
  if(td)td.onclick=function(){MONTH_OFFSET=0;rerender();};
  const wp=document.getElementById("week-prev"),wn=document.getElementById("week-next"),wt=document.getElementById("week-today");
  if(wp)wp.onclick=function(){WEEK_OFFSET--;rerender();};
  if(wn)wn.onclick=function(){WEEK_OFFSET++;rerender();};
  if(wt)wt.onclick=function(){WEEK_OFFSET=0;rerender();};
  const qp=document.getElementById("q-prev"),qn=document.getElementById("q-next"),qt=document.getElementById("q-today");
  if(qp)qp.onclick=function(){QUARTER_OFFSET--;rerender();};
  if(qn)qn.onclick=function(){QUARTER_OFFSET++;rerender();};
  if(qt)qt.onclick=function(){QUARTER_OFFSET=0;rerender();};
})();
fitStage();tick();refresh();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fitColumns();fitSched();});
setTimeout(function(){fitColumns();fitSched();},400);
setTimeout(function(){fitColumns();fitSched();},1200);
setInterval(tick,10000);
setInterval(refresh,REFRESH_MINUTES*60000);
</script>
</body>
</html>
