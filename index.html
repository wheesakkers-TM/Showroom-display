<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showroom opening hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Tuinmaximaal showroom board — CONFIG in the <script> below.
   Brand: forest #003017, deep #001A13, orange #FF8000,
          lime #A2BA1C, white cards, Century Gothic / Jost.
   ============================================================ */
:root{
  --forest:#003017; --forest-2:#001A13;
  --orange:#FF8000; --orange-ink:#C85A0E;
  --lime:#A2BA1C; --sage:#9FB884; --sage-dim:#7F9668;
  --card:#FFFFFF; --ink:#0F241A; --muted:#6C7A72; --hair:#EBF0EA;
  --closed-ink:#455349;
  --dot-quiet:#4E9A2A; --dot-moderate:#E8912A; --dot-busy:#C63F2B;
  --panel:rgba(255,255,255,.055); --panel-border:rgba(255,255,255,.12);
  --hair-soft:rgba(255,255,255,.14);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--forest-2);}
body{font-family:"Century Gothic","Jost","Poppins",system-ui,-apple-system,Segoe UI,sans-serif;
  color:#fff;-webkit-font-smoothing:antialiased;overflow:hidden;}
.ic{width:22px;height:22px;flex-shrink:0;}

#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--forest-2);}
#stage{width:1920px;height:1080px;transform-origin:center center;
  background:radial-gradient(120% 120% at 15% 0%, #013C1E 0%, #00301A 45%, #001A12 100%);
  display:flex;flex-direction:column;padding:50px 60px 30px;}

/* ---------- header ---------- */
.head{display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:1px solid var(--hair-soft);padding-bottom:24px;}
.head__eyebrow{font-weight:700;letter-spacing:.42em;text-transform:uppercase;
  font-size:20px;color:var(--orange);margin-bottom:9px;}
.head__title{font-weight:700;font-size:62px;line-height:.96;letter-spacing:-.01em;color:#fff;}
.head__sub{font-weight:500;font-size:25px;color:var(--sage);margin-top:13px;}
.head__right{text-align:right;padding-bottom:2px;}
.clock{font-weight:700;font-size:64px;line-height:1;color:#fff;font-variant-numeric:tabular-nums;}
.today{font-weight:500;font-size:24px;color:var(--sage);margin-top:7px;}

/* ---------- two week columns ---------- */
.cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:46px;padding-top:30px;min-height:0;}
.col{display:flex;flex-direction:column;min-height:0;position:relative;}
.col+.col{padding-left:46px;border-left:1px solid var(--hair-soft);margin-left:-46px;}
.col__head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;}
.col__label{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:31px;color:#fff;}
.col__range{font-weight:500;font-size:23px;color:var(--sage);}
.col__body{flex:1;overflow:hidden;min-height:0;}
.fit{display:flex;flex-direction:column;gap:26px;transform-origin:top left;}

/* ---------- section labels ---------- */
.sechead{display:flex;align-items:center;gap:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.14em;font-size:19px;margin-bottom:15px;}
.sechead--changes{color:var(--orange);}
.sechead--open{color:var(--lime);}
.sechead__count{font-weight:600;color:var(--sage-dim);letter-spacing:.06em;}

/* ---------- event cards (one per special day) ---------- */
.cards{display:grid;grid-template-columns:1fr;gap:16px;}
.cards[data-cols="2"]{grid-template-columns:1fr 1fr;}
.cards[data-cols="3"]{grid-template-columns:1fr 1fr 1fr;}
.holi{flex:1;overflow:hidden;min-height:0;padding-top:30px;}
.stage--compact{padding:26px 60px 20px;}
.stage--compact .head{padding-bottom:14px;}
.stage--compact .head__eyebrow{font-size:17px;margin-bottom:5px;}
.stage--compact .head__title{font-size:44px;}
.stage--compact .head__sub{font-size:20px;margin-top:7px;}
.stage--compact .clock{font-size:48px;}
.stage--compact .today{font-size:20px;margin-top:4px;}
.stage--compact .sched{padding-top:12px;}
.stage--compact .foot{padding-top:12px;}
.stage--compact .brandbar{margin-top:9px;}
/* bare mode: no eyebrow, no footer text, small title, all space for the table */
.stage--bare{padding:30px 60px 24px;}
.stage--bare .head__eyebrow{display:none;}
.stage--bare .head{padding-bottom:16px;}
.stage--bare .head__title{font-size:38px;}
.stage--bare .head__sub{font-size:22px;margin-top:6px;color:var(--sage);}
.stage--bare .clock{font-size:46px;}
.stage--bare .today{font-size:19px;}
.stage--bare .foot{display:none;}
.stage--bare .sched{padding-top:18px;}
.stage--bare .grid{border-spacing:8px 8px;}
.stage--bare .gc{height:64px;border-radius:12px;}
.stage--bare .gc__t{font-size:24px;}
.stage--bare .gc .gdot{width:13px;height:13px;margin-left:9px;}
.stage--bare .gh__d{font-size:17px;}
.stage--bare .gh__n{font-size:26px;}
.stage--bare .gh{padding-bottom:6px;}
.stage--bare .gh--room{width:240px;}
.stage--bare .gflag .flg{width:32px;height:21px;margin-right:0;}
.stage--bare .gflag{margin-right:14px;}
.stage--bare .grname{font-size:28px;}
.stage--bare .gc--closed svg{width:24px;height:24px;}
/* ---------- schedule grid (main view) ---------- */
.sched{flex:1;overflow:hidden;min-height:0;padding-top:16px;display:flex;flex-direction:column;gap:10px;}
.sched-inner{width:100%;display:flex;flex-direction:column;gap:10px;transform-origin:top center;}
.gwrap__head{display:flex;align-items:baseline;gap:14px;margin-bottom:3px;}
.gwrap__label{font-weight:700;text-transform:uppercase;letter-spacing:.13em;font-size:21px;color:#fff;}
.gwrap__range{font-weight:600;font-size:17px;color:var(--sage);}
.grid{width:100%;border-collapse:separate;border-spacing:5px 4px;table-layout:fixed;}
.gh{padding:0 4px 2px;text-align:center;vertical-align:bottom;}
.gh--room{width:200px;}
.gh__d{display:block;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--sage-dim);}
.gh__n{display:block;font-weight:700;font-size:18px;color:#fff;line-height:1.05;}
.gh--today .gh__d{color:var(--orange);}
.gh--today .gh__n{color:var(--orange);}
.gc{background:var(--panel);border:1px solid var(--panel-border);border-radius:8px;
  height:37px;text-align:center;vertical-align:middle;padding:2px 5px;}
.gc__t{font-weight:700;font-size:17px;color:#F2F6EF;font-variant-numeric:tabular-nums;white-space:nowrap;}
.gc .gdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;vertical-align:middle;
  background:var(--dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--dot) 24%,transparent);}
.gc--room{background:transparent;border:none;text-align:left;padding-left:2px;}
.gflag{display:inline-flex;vertical-align:middle;margin-right:11px;}
.gflag .flg{width:27px;height:18px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.18);display:block;}
.grname{font-weight:700;font-size:21px;color:#fff;vertical-align:middle;}
.gc--closed{background:rgba(255,255,255,.03);}
.gc--closed svg{width:17px;height:17px;fill:var(--sage-dim);opacity:.6;}
[data-tip]{position:relative;cursor:help;}
.gc[data-tip]:hover{background:rgba(255,255,255,.07);}
[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#0B1F14;border:1px solid rgba(255,255,255,.22);color:#F2F6EF;font-weight:600;font-size:16px;
  padding:9px 15px;border-radius:10px;white-space:pre;text-align:left;line-height:1.45;
  z-index:9;box-shadow:0 12px 30px rgba(0,0,0,.5);pointer-events:none;}
.mev[data-tip]:hover::after{left:0;transform:none;font-size:17px;}
.mcd__n[data-tip]:hover::after{left:0;transform:none;}
.gc--muted{color:var(--sage-dim);font-size:17px;background:transparent;border:none;}
.gc--exc{background:rgba(255,128,0,.12);border-color:rgba(255,128,0,.32);}
.gc--exc .gc__t{color:#FFB469;}
.gc[data-today="1"]{outline:2px solid var(--orange);outline-offset:-1px;}
/* ---------- nav tabs ---------- */
.tabs{display:flex;gap:10px;padding:14px 0 0;}
.tab{display:inline-flex;align-items:center;padding:9px 20px;border-radius:999px;border:1px solid var(--panel-border);
  background:var(--panel);color:var(--sage);font-weight:700;font-size:18px;text-decoration:none;letter-spacing:.02em;}
.tab--on{background:var(--orange);border-color:var(--orange);color:#1B2B1F;}
/* ---------- month calendar (minimal) ---------- */
.monthv{flex:1;overflow:hidden;min-height:0;padding-top:12px;display:flex;flex-direction:column;gap:8px;}
.monthv>#month-grid{flex:1;min-height:0;}
#month-grid .mcal{height:100%;}
.monthv__bar{display:flex;align-items:baseline;justify-content:space-between;}
.monthv__title{font-weight:700;font-size:34px;color:#fff;letter-spacing:.01em;}
.monthv__nav{display:flex;gap:6px;}
.mbtn{background:transparent;border:none;color:var(--sage);border-radius:10px;
  font:inherit;font-weight:700;font-size:20px;padding:6px 14px;cursor:pointer;}
.mbtn:hover{color:#fff;background:rgba(255,255,255,.06);}
.mbtn--today{color:var(--orange);}
.mcal{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;}
.mch{font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:14px;color:var(--sage-dim);
  padding:0 10px 8px;text-align:left;}
.mch--w{width:52px;}
.mcw{font-weight:700;font-size:13px;color:var(--sage-dim);vertical-align:top;padding:12px 0 0 2px;text-align:left;
  border-top:1px solid var(--hair-soft);letter-spacing:.08em;}
.mcd{vertical-align:top;padding:10px 10px 8px;border-top:1px solid var(--hair-soft);}
.mcd__n{font-weight:600;font-size:15px;color:var(--sage-dim);line-height:1;margin-bottom:7px;}
.mcd__n--today{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin:-5px 0 3px -6px;
  border-radius:50%;background:var(--orange);color:#1B2B1F;font-weight:700;font-size:15px;}
.mcd--out{border-top:1px solid var(--hair-soft);}
.mcd--past{opacity:.38;}
.mev{margin-bottom:6px;}
.mev__t{font-weight:700;font-size:16px;color:#fff;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.mline{display:flex;align-items:flex-start;gap:6px;margin-top:3px;font-weight:600;font-size:14px;color:var(--sage);}
.mline svg{margin-top:2px;}
.mline svg{width:13px;height:13px;fill:var(--sage);flex-shrink:0;}
.mline span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.mline--adj{color:#FFB469;}
.mline--adj svg{fill:#FFB469;}
.mev__more{font-weight:600;font-size:13px;color:var(--sage-dim);}
.monthv .std{background:transparent;border:none;padding:6px 0 0;gap:8px 34px;border-top:1px solid var(--hair-soft);border-radius:0;}
.monthv .std__item{font-size:16px;color:var(--sage);}
.monthv .std__lock svg{width:14px;height:14px;}
.monthv .sechead{display:none;}
/* ---------- quarter view ---------- */
.qcols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;align-items:start;}
#quarterv>#q-grid{flex:1;min-height:0;overflow:hidden;}
.qm__title{font-weight:700;font-size:23px;color:#fff;margin-bottom:8px;}
.qcal{width:100%;border-collapse:collapse;table-layout:fixed;}
.qcal th{font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--sage-dim);padding:0 0 6px;text-align:center;}
.qcw{width:34px;font-weight:700;font-size:11px;color:var(--sage-dim);text-align:left;vertical-align:middle;}
td.qcw{padding:0;}
.qcd{text-align:center;vertical-align:middle;height:34px;position:relative;}
.qcd__n{font-weight:600;font-size:14px;color:#D9E4D5;}
.qcd--past .qcd__n{opacity:.35;}
.qcd--today .qcd__n{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:50%;background:var(--orange);color:#1B2B1F;font-weight:700;}
.qdot{position:absolute;left:50%;transform:translateX(-50%);bottom:1px;width:6px;height:6px;border-radius:50%;background:var(--orange);}
.qcd--past .qdot{opacity:.4;}
.qm__list{margin-top:12px;border-top:1px solid var(--hair-soft);padding-top:10px;display:flex;flex-direction:column;gap:6px;}
.qev{display:flex;gap:10px;align-items:baseline;font-size:15px;color:#E4EDE0;font-weight:600;line-height:1.3;}
.qev__d{flex-shrink:0;width:52px;font-weight:700;color:var(--lime);font-size:13px;letter-spacing:.03em;}
.qev__t svg{width:12px;height:12px;fill:var(--sage);vertical-align:-1px;margin-right:3px;}
.qev--more,.qev--none{color:var(--sage-dim);font-weight:600;}
/* ---------- agenda board (holidays view) ---------- */
.agcols{display:grid;grid-template-columns:1fr 1fr;gap:11px 38px;align-items:start;}
.agcol{display:flex;flex-direction:column;gap:11px;min-width:0;}
.wkdiv{display:flex;align-items:center;gap:14px;margin:4px 0 0;}
.wkdiv__label{font-weight:700;text-transform:uppercase;letter-spacing:.15em;font-size:19px;color:var(--lime);white-space:nowrap;}
.wkdiv__range{font-weight:600;font-size:18px;color:var(--sage-dim);white-space:nowrap;letter-spacing:.05em;}
.wkdiv::after{content:"";flex:1;height:1px;background:var(--hair-soft);}
.agrow{display:flex;align-items:center;gap:20px;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:14px;padding:10px 22px 10px 10px;}
.datebox{width:86px;flex-shrink:0;background:var(--card);border-radius:10px;text-align:center;
  padding:6px 4px 7px;box-shadow:0 8px 20px rgba(0,0,0,.25);}
.datebox__day{font-weight:700;font-size:30px;line-height:1;color:var(--ink);}
.datebox__sub{font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--orange-ink);text-transform:uppercase;margin-top:3px;}
.agrow__main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
.agrow__title{font-weight:700;font-size:28px;line-height:1.05;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.agrow__title .card__icon{font-size:25px;}
.agrow__grp{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.agrow .tag{font-size:19px;padding:4px 11px;}
.agrow .tag .ic{width:18px;height:18px;}
.agrow .room{color:#F2F6EF;font-size:22px;}
.agrow .room__cc{background:rgba(255,255,255,.16);}
.agrow .tag--closed{color:#DCE5DA;background:rgba(255,255,255,.10);}
.agrow .tag--closed .ic{fill:#DCE5DA;}
.agrow .tag--normal{color:#CFDCCB;background:rgba(255,255,255,.08);}
.agrow .tag--adj{color:#FFB469;background:rgba(255,128,0,.16);}
.std{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;
  padding:18px 24px;display:flex;flex-wrap:wrap;gap:12px 40px;}
.std__item{display:inline-flex;align-items:center;gap:10px;font-weight:500;font-size:23px;color:#E4EDE0;}
.std__lock{display:inline-flex;}
.std__lock svg{width:18px;height:18px;fill:var(--sage);}
.std__sig{font-weight:700;color:var(--sage);}
.chip--off{opacity:.55;}
.chip__lockic{display:inline-flex;flex-shrink:0;}
.chip__lockic svg{width:15px;height:15px;fill:var(--sage);}
.card{background:var(--card);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.30);
  padding:22px 26px;overflow:hidden;}
.card__top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--hair);}
.card__title{font-weight:700;font-size:28px;line-height:1.05;color:var(--ink);}
.card__icon{font-size:26px;margin-left:2px;}
.card__date{font-weight:600;font-size:21px;color:var(--muted);white-space:nowrap;}

.grps{display:flex;flex-direction:column;gap:12px;}
.grp{display:flex;align-items:flex-start;gap:16px;}
.grp__tags{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.tag{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:20px;
  padding:6px 13px;border-radius:9px;white-space:nowrap;flex-shrink:0;min-width:60px;justify-content:center;}
.tag .ic{width:20px;height:20px;}
.tag--closed{color:var(--closed-ink);background:rgba(69,83,73,.10);}
.tag--adj{color:var(--orange-ink);background:rgba(255,128,0,.12);font-variant-numeric:tabular-nums;}
.tag--normal{color:var(--closed-ink);background:rgba(15,36,26,.07);}
.tag--crowd{color:var(--ink);background:color-mix(in srgb,var(--dot) 13%,transparent);}
.tag--crowd .rdot{width:15px;height:15px;}
.grp__rooms{display:flex;flex-wrap:wrap;gap:8px 10px;padding-top:3px;}
.room{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:22px;color:var(--ink);}
.room:not(:last-child)::after{content:"";}
.room__cc{font-weight:700;font-size:14px;letter-spacing:.06em;color:#fff;background:var(--ink);
  padding:2px 7px;border-radius:6px;}
.rdot{width:14px;height:14px;border-radius:50%;background:var(--dot);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--dot) 24%,transparent);}

/* ---------- open-as-usual chips ---------- */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
.chip{display:flex;align-items:center;gap:11px;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:11px;padding:12px 15px;}
.chip__dot{width:12px;height:12px;border-radius:50%;background:var(--dot,var(--lime));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--dot,var(--lime)) 26%,transparent);flex-shrink:0;}
.chip__name{font-weight:600;font-size:22px;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip__cc{font-weight:700;font-size:14px;letter-spacing:.08em;color:var(--sage);}

/* ---------- all-open hero (a week with no changes) ---------- */
.hero{display:flex;align-items:center;gap:20px;background:var(--panel);
  border:1px solid var(--panel-border);border-radius:16px;padding:30px 34px;margin-bottom:26px;}
.hero__ic{width:64px;height:64px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--lime) 20%,transparent);}
.hero__ic svg{width:38px;height:38px;stroke:var(--lime);stroke-width:2.6;fill:none;}
.hero__t{font-weight:700;font-size:34px;color:#fff;}
.hero__s{font-weight:500;font-size:23px;color:var(--sage);margin-top:5px;}

/* ---------- footer ---------- */
.foot{display:none;justify-content:space-between;align-items:center;padding:18px 2px 0;}
.foot .legend,.foot .foot__brand{display:none;}
.foot__note{font-weight:500;font-size:19px;color:var(--sage-dim);display:flex;align-items:center;gap:10px;}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--lime);animation:pulse 2.6s ease-out infinite;}
.foot__brand{font-weight:600;font-size:18px;letter-spacing:.08em;color:var(--sage-dim);text-transform:uppercase;}
.legend{display:flex;gap:22px;}
.lg{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:18px;color:var(--sage-dim);}
.lg--label{text-transform:uppercase;letter-spacing:.12em;font-size:15px;margin-right:2px;}
.lg i{width:12px;height:12px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--dot) 24%,transparent);}
.brandbar{height:6px;background:linear-gradient(90deg,var(--orange),#ffab52);border-radius:3px;margin-top:13px;}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lime) 55%,transparent);}70%{box-shadow:0 0 0 11px transparent;}100%{box-shadow:0 0 0 0 transparent;}}

.card,.hero{animation:rise .5s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.card,.hero{animation:none;}.pulse{animation:none;}}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <header class="head">
      <div class="head__left">
        <div class="head__eyebrow">Tuinmaximaal</div>
        <h1 class="head__title" id="title">Showroom opening hours</h1>
        <div class="head__sub" id="subtitle">&nbsp;</div>
      </div>
      <div class="head__right">
        <div class="clock" id="clock">--:--</div>
        <div class="today" id="today">&nbsp;</div>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <a class="tab" data-v="" href="?">Week</a>
      <a class="tab" data-v="month" href="?view=month">Month</a>
      <a class="tab" data-v="quarter" href="?view=quarter">Quarter</a>
    </nav>

    <main class="cols" style="display:none">
      <section class="col">
        <div class="col__head"><div class="col__label">This week</div><div class="col__range" id="range-this">&nbsp;</div></div>

const ICONS=[
 [/between christmas/i,"\u{1F6CD}\uFE0F"],           // 🛍️ shopping days between Xmas & NY

function fcKey(d,room){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"|"+room;}
function fmtTime(t){
  // "10:00:00" -> "10:00", "9:5" -> "09:05"; leaves other text untouched
  const m=(t||"").trim().match(/^(\d{1,2}):(\d{1,2})(?::\d{1,2})?$/);
  if(!m)return (t||"").trim();
  return String(+m[1]).padStart(2,"0")+":"+String(+m[2]).padStart(2,"0");
}
function parseDate(s){
  s=(s||"").trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(m){
    let day=+m[1],mon=+m[2];
    if(mon>12&&day<=12){const t=day;day=mon;mon=t;}   // tolerate US order (m/d/y)
    if(mon<1||mon>12||day<1||day>31)return null;
    return new Date(+m[3],mon-1,day);
  }
  const d=new Date(s);return isNaN(d)?null:d;
}
function mondayOf(d){const day=(d.getDay()+6)%7;return new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);}

function todayDate(){const d=DEMO_TODAY?parseDate(DEMO_TODAY):null;return d||new Date();}
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3);
  const firstThu=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const fday=(firstThu.getUTCDay()+6)%7; firstThu.setUTCDate(firstThu.getUTCDate()-fday+3);
  return 1+Math.round((t-firstThu)/(7*DAY));
}
/* Standard opening for a showroom on a date: {closed:bool, from, until} or null if no pattern. */
function standardHours(room,d){
  const pat=STANDARD[room]; if(!pat)return null;
  let v=(pat[(d.getDay()+6)%7]||"").trim();
  const lv=v.toLowerCase();
  if(lv===""||lv==="x"||lv==="dicht"||lv==="closed")return {closed:true};
  if(lv.indexOf("even")===0||lv.indexOf("oneven")===0||lv.indexOf("odd")===0){
    const odd=lv.indexOf("oneven")===0||lv.indexOf("odd")===0;
    const open= odd ? isoWeek(d)%2===1 : isoWeek(d)%2===0;
    if(!open)return {closed:true,alt:true};
    const rest=v.replace(/^(oneven|even|odd)/i,"").trim();
    return parseHours(rest)||parseHours(DEFAULT_HOURS);
  }
  const h=parseHours(v); return h||{closed:true};
}
function parseHours(s){
  const m=(s||"").match(/^(\d{1,2}:\d{2})\s*[-\u2013]\s*(\d{1,2}:\d{2})$/);
  if(!m)return null;
  return {closed:false,from:fmtTime(m[1]),until:fmtTime(m[2])};
}

const DAY=86400000;
function fmtWhen(d){return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});}
function fmtRange(a,b){
  const sameMonth=a.getMonth()===b.getMonth();
  const left=a.toLocaleDateString("en-GB",{day:"numeric",month:sameMonth?undefined:"short"});
  const right=b.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  return `${left} \u2013 ${right}`;
}
function parseCSV(text){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else{if(ch==='"')q=true;else if(ch===',')row.push(cur),cur="";
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur="";}
      else if(ch==='\r'){}else cur+=ch;}}
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function rowsToObjects(rows){
  if(!rows.length)return[];
  const head=rows[0].map(h=>h.trim().toLowerCase());const idx=n=>head.indexOf(n);
  const iD=idx("date"),iS=idx("showroom"),iC=idx("country"),iSt=idx("status"),
        iF=idx("open from"),iU=idx("open until"),iR=idx("reason"),iCr=idx("crowd");
  return rows.slice(1).map(r=>({
    Date:(r[iD]||"").trim(),Showroom:(r[iS]||"").trim(),Country:(r[iC]||"").trim(),
    Status:(r[iSt]||"").trim(),OpenFrom:fmtTime(r[iF]),OpenUntil:fmtTime(r[iU]),
    Reason:(r[iR]||"").trim(),Crowd:(r[iCr]||"").trim()
  }));
}

function roomHTML(it,withDot){

function eventCardHTML(ev){
  // sub-group rows: closed together, adjusted grouped by identical time, normal-hours together
  const groups=new Map();
  ev.rows.forEach(it=>{
    if(isClosed(it.Status)){
      if(!groups.has("closed"))groups.set("closed",{type:"closed",rooms:[]});
      groups.get("closed").rooms.push(it);
    }else if(isAdjusted(it.Status)||(it.OpenFrom&&it.OpenUntil)){
      const k="adj|"+it.OpenFrom+"|"+it.OpenUntil;
      if(!groups.has(k))groups.set(k,{type:"adj",from:it.OpenFrom,until:it.OpenUntil,rooms:[]});
      groups.get(k).rooms.push(it);
    }else{
      if(!groups.has("normal"))groups.set("normal",{type:"normal",rooms:[]});
      groups.get("normal").rooms.push(it);
    }
  });
  // adjusted first, then normal-hours, closed last
  const order={adj:0,normal:1,closed:2};
  const arr=[...groups.values()].sort((a,b)=>order[a.type]-order[b.type]);
  const d=parseDate(ev.date);
  const dateStr=d?fmtWhen(d):ev.date;
  const icon=iconFor(ev.reason);
  const title=(ev.reason?ev.reason:dateStr)+(icon?` <span class="card__icon">${icon}</span>`:"");
  const dateChip=ev.reason?dateStr:"";
  let g="";
  arr.forEach(gr=>{
    let tag,withDots=true;
    if(gr.type==="closed"){tag=`<span class="tag tag--closed">${LOCK_SVG}Closed</span>`;withDots=false;}

function buildWeek(data,mon,resolve,lockDate){

function standardSummaryHTML(){

    const parts=[];
    pat.forEach((v,i)=>{
      v=(v||"").trim().toLowerCase();
      if(v===""||v==="x"||v==="dicht"||v==="closed"){parts.push(DAYN[i]);return;}
      if(v.indexOf("oneven")===0||v.indexOf("odd")===0){parts.push(DAYN[i]+" (even weeks)");return;}
      if(v.indexOf("even")===0){parts.push(DAYN[i]+" (odd weeks)");return;}
      // otherwise: opening hours = open, not a closing day

function agendaRowHTML(ev){

  });
  return `<div class="agrow"><div class="datebox"><div class="datebox__day">${d?d.getDate():""}</div>`+
         `<div class="datebox__sub">${dow} ${mon}</div></div>`+
         `<div class="agrow__main"><div class="agrow__title">${title}</div>${grps}</div></div>`;

function buildHolidays(data){
  const today=todayDate();
  const base=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const until=addDays(base,42);
  const items=data.filter(it=>{const d=parseDate(it.Date);return d&&d>=base&&d<=until;});
  if(!items.length){
    return `<div class="hero"><div class="hero__ic">${CHECK_SVG}</div>`+
           `<div><div class="hero__t">No special days coming up</div>`+
           `<div class="hero__s">All showrooms open as usual for the next 6 weeks</div></div></div>`+
           standardSummaryHTML();
  }
  const ev=new Map();
  items.forEach(it=>{const key=it.Date+"|"+(it.Reason||"");
    if(!ev.has(key))ev.set(key,{date:it.Date,reason:it.Reason||"",rows:[]});
    ev.get(key).rows.push(it);});
  const events=[...ev.values()].sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  // group per week
  const byWeek=new Map();
  events.forEach(e=>{const m=mondayOf(parseDate(e.date));const k=m.getTime();
    if(!byWeek.has(k))byWeek.set(k,{mon:m,events:[]});byWeek.get(k).events.push(e);});
  const weeks=[...byWeek.values()].sort((a,b)=>a.mon-b.mon);
  const monThis=mondayOf(base);
  // flat item list (dividers + events) for near-equal column balancing
  const flat=[];
  weeks.forEach(w=>{
    const off=Math.round((w.mon-monThis)/(7*DAY));
    const label=off===0?"This week":off===1?"Next week":"Week "+isoWeek(w.mon);
    const div=`<div class="wkdiv"><span class="wkdiv__label">${label}</span><span class="wkdiv__range">${fmtRange(w.mon,addDays(w.mon,6))}</span></div>`;
    flat.push({html:div,weight:1,div:div,isDiv:true});
    w.events.forEach(e=>{
      const kinds=new Set(e.rows.map(r=>isClosed(r.Status)?"c":(isAdjusted(r.Status)||(r.OpenFrom&&r.OpenUntil))?("a|"+r.OpenFrom+"|"+r.OpenUntil):"n"));
      flat.push({html:agendaRowHTML(e),weight:2+(kinds.size-1),div:div,isDiv:false});
    });
  });
  const total=flat.reduce((s,i)=>s+i.weight,0);
  let acc=0,split=flat.length;
  for(let i=0;i<flat.length;i++){acc+=flat[i].weight;if(acc>=total/2){split=i+1;break;}}
  if(split<flat.length && flat[split-1] && flat[split-1].isDiv)split--;   // no orphan week header at column bottom
  const leftItems=flat.slice(0,split),rightItems=flat.slice(split);
  let right="";
  if(rightItems.length && !rightItems[0].isDiv)right+=rightItems[0].div;  // repeat week header when a week continues
  right+=rightItems.map(i=>i.html).join("");
  const left=leftItems.map(i=>i.html).join("");
  let html=`<div class="agcols"><div class="agcol">${left}</div><div class="agcol">${right}</div></div>`;
  html+=standardSummaryHTML();
  return html;
}
/* Effective schedule for one showroom on one date: merges standard hours with an exception override.
   Returns {closed, from, until, crowd, reason, isException}. */
function effectiveDay(room,country,d,exMap){
  const key=fcKey(d,room);
  const ex=exMap[key];
  if(ex){
    if(isClosed(ex.Status))return {closed:true,reason:ex.Reason,isException:true};
    if(isAdjusted(ex.Status)||(ex.OpenFrom&&ex.OpenUntil))
      return {closed:false,from:ex.OpenFrom,until:ex.OpenUntil,crowd:ex.Crowd,reason:ex.Reason,isException:true};
    // Normal hours exception: keep standard times, but carry crowd/reason
    const st=standardHours(room,d)||{closed:false,from:"",until:""};
    return {closed:!!st.closed,from:st.from,until:st.until,crowd:ex.Crowd,reason:ex.Reason,isException:true};
  }
  const st=standardHours(room,d);
  if(!st)return {closed:false,from:"",until:"",unknown:true};
  const crowd=FORECAST[key]||"";
  return {closed:!!st.closed,alt:!!st.alt,from:st.from,until:st.until,crowd:crowd,isException:false};
}

function buildMonth(data,anchor){
  const first=new Date(anchor.getFullYear(),anchor.getMonth(),1);
  const last=new Date(anchor.getFullYear(),anchor.getMonth()+1,0);
  const start=mondayOf(first);
  const weeks=Math.ceil(((last-start)/DAY+1)/7);
  const today=todayDate();
  const t0=new Date(today.getFullYear(),today.getMonth(),today.getDate()).getTime();
  // exceptions per day
  const byDay={};
  const exMap={};
  data.forEach(it=>{
    const d=parseDate(it.Date);if(!d)return;
    const k=d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
    (byDay[k]=byDay[k]||[]).push(it);
    exMap[fcKey(d,it.Showroom)]=it;
  });
  const DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let h=`<table class="mcal"><thead><tr><th class="mch mch--w">Wk</th>`;
  DOW.forEach(d=>h+=`<th class="mch">${d}</th>`);
  h+=`</tr></thead><tbody>`;
  for(let w=0;w<weeks;w++){
    const wkMon=addDays(start,w*7);
    h+=`<tr style="height:${(100/weeks).toFixed(2)}%"><td class="mcw">W${isoWeek(wkMon)}</td>`;
    for(let i=0;i<7;i++){
      const d=addDays(wkMon,i);
      const inMonth=d.getMonth()===anchor.getMonth();
      const isToday=d.getTime()===t0;
      const past=d.getTime()<t0;
      const k=d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
      const items=byDay[k]||[];
      if(!inMonth){h+=`<td class="mcd mcd--out"></td>`;continue;}
      // group per reason
      const ev=new Map();
      items.forEach(it=>{const key=it.Reason||"";
        if(!ev.has(key))ev.set(key,{reason:key,rows:[]});
        ev.get(key).rows.push(it);});
      let cell="";
      let shown=0;
      ev.forEach(e=>{
        if(shown>=2){return;}
        shown++;
        const icon=iconFor(e.reason);
        const closed=e.rows.filter(x=>isClosed(x.Status));
        const adj=e.rows.filter(x=>!isClosed(x.Status)&&(isAdjusted(x.Status)||(x.OpenFrom&&x.OpenUntil)));
        let lines="";
        if(closed.length)lines+=`<div class="mline mline--closed">${LOCK_SVG}<span>${roomList(closed)}</span></div>`;
        if(adj.length)lines+=`<div class="mline mline--adj">${CLOCK_SVG}<span>${roomList(adj)}</span></div>`;
        // full hover card text
        const tp=[e.reason||"Special day"];
        if(closed.length)tp.push("Closed: "+roomList(closed));
        adj.forEach(x=>tp.push(`${x.Showroom}: ${x.OpenFrom}\u2013${x.OpenUntil}`));
        e.rows.filter(x=>!isClosed(x.Status)&&!(isAdjusted(x.Status)||(x.OpenFrom&&x.OpenUntil))).forEach(x=>{
          const cw=crowdInfo(x.Crowd);if(cw)tp.push(`${x.Showroom}: expected footfall ${cw.label}`);
        });
        cell+=`<div class="mev"${tipAttr(tp.join("\n"))}><div class="mev__t">${icon?icon+" ":""}${e.reason||"Special day"}</div>${lines}</div>`;
      });
      if(ev.size>2)cell+=`<div class="mev__more">+${ev.size-2} more</div>`;
      const dtip=dayClosedTip(d,exMap);
      h+=`<td class="mcd${past?" mcd--past":""}">`+
         `<div class="mcd__n${isToday?" mcd__n--today":""}"${tipAttr(dtip)}>${d.getDate()}</div>${cell}</td>`;
    }
    h+=`</tr>`;

  h+=`</tbody></table>`;
  return h;

function roomList(rows){
  // compact: whole-country groups become "DE" / "NL" / "UK", otherwise names
  const byC={};rows.forEach(r=>{(byC[r.Country||""]=byC[r.Country||""]||[]).push(r.Showroom);});
  const parts=[];
  Object.keys(byC).forEach(c=>{
    const all=SHOWROOMS.filter(s=>s.country===c).map(s=>s.name);
    const got=byC[c];
    if(all.length&&got.length>=all.length&&all.every(n=>got.indexOf(n)>=0)){
      parts.push("All "+countryBadgeTxt(c));
    }else parts.push(got.join(", "));
  });
  return parts.join(" \u00b7 ");

    startM.toLocaleDateString("en-GB",{month:"short"})+" \u2013 "+endM.toLocaleDateString("en-GB",{month:"short",year:"numeric"});
  const byDay={},exMap={};
  data.forEach(it=>{const d=parseDate(it.Date);if(!d)return;
    const k=d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
    (byDay[k]=byDay[k]||[]).push(it);exMap[fcKey(d,it.Showroom)]=it;});
  let h='<div class="qcols">';
  for(let m=0;m<3;m++){
    h+=buildMiniMonth(data,new Date(startM.getFullYear(),startM.getMonth()+m,1),exMap,byDay,t0);
  }
  h+='</div>';
  document.getElementById("q-grid").innerHTML=h;
  if(problems.length){
    const f=document.querySelector(".foot");if(f)f.style.display="flex";
    document.getElementById("updated").textContent="\u26A0 "+problems.join(" & ")+" data unavailable, retrying";
  }
}
function initNav(){
  try{
    const p=new URLSearchParams(location.search);
    if(p.get("nav")==="0"){document.getElementById("tabs").style.display="none";return;}
    const cur0=p.get("view")||"";
    const cur=(cur0==="next")?"":cur0;
    document.querySelectorAll("#tabs .tab").forEach(a=>{
      if(a.getAttribute("data-v")===cur)a.classList.add("tab--on");
    });
  }catch(e){}
}
function render(data,problems){
  problems=problems||[];
  LAST_RENDER_DATA=data;LAST_PROBLEMS=problems;
  if(VIEW==="month"){renderMonth(data,problems);return;}
  if(VIEW==="quarter"){renderQuarter(data,problems);return;}
  const today=todayDate();
  const base=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  if(VIEW==="holidays"){
    document.getElementById("title").textContent="Coming up";
    document.getElementById("subtitle").innerHTML="Holidays &amp; special days &mdash; next 6 weeks";
    document.querySelector(".cols").style.display="none";
    document.getElementById("sched").style.display="none";
    document.getElementById("monthv").style.display="none";
    document.getElementById("quarterv").style.display="none";
    const holi=document.getElementById("holi");holi.style.display="block";
    const fit=document.getElementById("holi-fit");
    fit.style.gap="14px";
    fit.innerHTML=buildHolidays(data);
    fitColumns();
    const now=new Date();
    let status="Auto-updating \u00b7 last checked "+now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    if(problems.length)status+=" \u00b7 \u26A0 "+problems.join(" & ")+" data unavailable, retrying";
    document.getElementById("updated").textContent=status;
    return;
  }
  const monThis=mondayOf(base);
  const mon=addDays(monThis,7*WEEK_OFFSET);
  document.querySelector(".cols").style.display="none";
  document.getElementById("holi").style.display="none";
  document.getElementById("monthv").style.display="none";
  document.getElementById("quarterv").style.display="none";
  document.getElementById("stage").classList.add("stage--compact","stage--bare");
  document.getElementById("title").textContent="Showroom opening hours";
  document.getElementById("subtitle").innerHTML="&nbsp;";
  const sched=document.getElementById("sched");sched.style.display="flex";
  const wl=WEEK_OFFSET===0?"This week":WEEK_OFFSET===1?"Next week":"Week "+isoWeek(mon);
  document.getElementById("week-title").textContent=wl+" \u00b7 "+fmtRange(mon,addDays(mon,6));
  document.getElementById("grid-this").innerHTML=buildGrid(data,mon,WEEK_OFFSET===0?base:null);
  fitSched();
  if(problems.length){
    const f=document.querySelector(".foot");if(f)f.style.display="flex";
    document.getElementById("updated").textContent="\u26A0 "+problems.join(" & ")+" data unavailable, retrying";
  }
}
function fitSched(){
  const wrap=document.getElementById("sched");if(!wrap||wrap.style.display==="none")return;
  const inner=document.getElementById("sched-inner");
  inner.style.transform="none";
  const avail=wrap.clientHeight,need=inner.scrollHeight;
  const k=need>avail+1?avail/need:1;
  inner.style.transform="scale("+k+")";inner.style.transformOrigin="top center";
}
function fitColumns(){
  const fits=[...document.querySelectorAll(".fit")];if(!fits.length)return;
  fits.forEach(f=>{f.style.transform="none";f.style.width="100%";});
  let k=1;
  fits.forEach(f=>{const avail=f.parentElement.clientHeight,need=f.scrollHeight;if(need>avail+1)k=Math.min(k,avail/need);});
  if(k<1)fits.forEach(f=>{f.style.width=(100/k)+"%";f.style.transform="scale("+k+")";});
}

/* ============================================================
   DATA + CLOCK + SCALING + BOOT
   ============================================================ */
const FETCH_TIMEOUT_MS = 6000;   // never wait longer than this per CSV
let LAST_GOOD_DATA = null;       // keep last successful exceptions so a hiccup doesn't blank the board
function fetchTimeout(url,ms){
  if(typeof AbortController==="undefined")return fetch(url,{cache:"no-store"});
  const ctl=new AbortController();
  const t=setTimeout(function(){ctl.abort();},ms);
  const p=fetch(url,{cache:"no-store",signal:ctl.signal});
  p.then(function(){clearTimeout(t);},function(){clearTimeout(t);});
  return p;
}
function settle(p){return p.then(function(v){return{status:"fulfilled",value:v};},function(e){return{status:"rejected",reason:e};});}
async function loadForecast(){
  const map={};
  if(!FORECAST_CSV_URL){
    const demoT=DEMO_TODAY?parseDate(DEMO_TODAY):null;
    if(demoT){
      const m=mondayOf(demoT);
      for(let i=0;i<14;i++){const d=addDays(m,i);
        SHOWROOMS.forEach(s=>{map[fcKey(d,s.name)]=SAMPLE_FORECAST[s.name]||"Quiet";});}
    }
    return map;
  }
  const r=await fetchTimeout(FORECAST_CSV_URL,FETCH_TIMEOUT_MS);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const rows=parseCSV(await r.text());
  if(!rows.length)return map;
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const iD=head.indexOf("date"),iS=head.indexOf("showroom"),iC=head.indexOf("crowd");
  if(iD<0||iS<0||iC<0)throw new Error("Forecast CSV mist kolommen Date/Showroom/Crowd");
  rows.slice(1).forEach(row=>{
    const d=parseDate(row[iD]);if(!d)return;
    map[fcKey(d,(row[iS]||"").trim())]=(row[iC]||"").trim();
  });
  return map;
}
async function loadExceptions(){
  if(!CSV_URL)return SAMPLE_DATA;                    // preview mode only
  const res=await fetchTimeout(CSV_URL,FETCH_TIMEOUT_MS);
  if(!res.ok)throw new Error("HTTP "+res.status);
  const objs=rowsToObjects(parseCSV(await res.text()));
  LAST_GOOD_DATA=objs;
  return objs;                                       // empty sheet = everything open (not sample data)
}
async function loadStandard(){
  if(!STANDARD_CSV_URL)return STANDARD_DEFAULT;
  const r=await fetchTimeout(STANDARD_CSV_URL,FETCH_TIMEOUT_MS);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const rows=parseCSV(await r.text());
  if(rows.length<2)return STANDARD_DEFAULT;
  const head=rows[0].map(h=>(h||"").trim().toLowerCase());
  const DAYS=[["ma","mon","maandag","monday"],["di","tue","dinsdag","tuesday"],["wo","wed","woensdag","wednesday"],
              ["do","thu","donderdag","thursday"],["vr","fri","vrijdag","friday"],["za","sat","zaterdag","saturday"],
              ["zo","sun","zondag","sunday"]];
  const iRoom=head.findIndex(h=>h==="showroom"||h==="vestiging");
  const dayIdx=DAYS.map(alts=>head.findIndex(h=>alts.indexOf(h)>=0));
  const out={};
  if(iRoom>=0 && !dayIdx.some(i=>i<0)){
    // row format: Showroom | Ma..Zo
    rows.slice(1).forEach(r2=>{
      const name=(r2[iRoom]||"").trim();if(!name)return;
      out[name]=dayIdx.map(i=>normStd(r2[i]));
    });
  }else{
    // block format: per showroom three columns (label | van | tot), day names as rows
    const known={};SHOWROOMS.forEach(s=>known[s.name.toLowerCase()]=s.name);
    const dayRow={};
    rows.forEach((r2,ri)=>{
      const lbl=(r2[0]||"").trim().toLowerCase();
      DAYS.forEach((alts,di)=>{if(alts.indexOf(lbl)>=0)dayRow[di]=ri;});
    });
    // find day rows by scanning all label columns (block labels repeat per block)
    const labelCols=[];
    (rows[0]||[]).forEach((cell,ci)=>{
      const nm=known[(cell||"").trim().toLowerCase()];
      if(nm)labelCols.push({col:ci,name:nm});
    });
    labelCols.forEach(({col,name})=>{
      const pat=["","","","","","",""];
      rows.forEach(r2=>{
        const lbl=(r2[col]||"").trim().toLowerCase();
        DAYS.forEach((alts,di)=>{
          if(alts.indexOf(lbl)>=0){
            const from=(r2[col+1]||"").trim(),until=(r2[col+2]||"").trim();
            pat[di]=normStdPair(from,until);
          }
        });
      });
      out[name]=pat;
    });
  }
  if(!Object.keys(out).length)return STANDARD_DEFAULT;
  // rooms missing from the sheet keep the built-in pattern
  SHOWROOMS.forEach(s=>{if(!out[s.name])out[s.name]=STANDARD_DEFAULT[s.name]||["","","","","","",""];});
  return out;
}
function normStd(v){
  v=(v||"").trim();
  const lv=v.toLowerCase();
  if(lv==="om de week")return "even";
  return v;
}
function normStdPair(from,until){
  const lf=from.toLowerCase(),lu=until.toLowerCase();
  if(lf==="om de week"||lu==="om de week")return "even";
  if(/^(even|oneven|odd)$/.test(lf))return from;
  const f=fmtTime(from),u=fmtTime(until);
  if(/^\d{2}:\d{2}$/.test(f)&&/^\d{2}:\d{2}$/.test(u))return f+"-"+u;
  return "";   // empty or unparsable = closed
}
let retryTimer=null;
async function refresh(){
  const results=await Promise.all([settle(loadForecast()),settle(loadExceptions()),settle(loadStandard())]);
  const fc=results[0],ex=results[1],st=results[2];
  FORECAST = fc.status==="fulfilled" ? fc.value : {};
  STANDARD = st.status==="fulfilled" ? st.value : STANDARD_DEFAULT;
  const data = ex.status==="fulfilled" ? ex.value : (LAST_GOOD_DATA||[]);
  const problems=[];
  if(FORECAST_CSV_URL && fc.status!=="fulfilled"){problems.push("forecast");console.warn("Forecast CSV:",fc.reason);}
  if(CSV_URL && ex.status!=="fulfilled"){problems.push("hours");console.warn("Hours CSV:",ex.reason);}
  if(STANDARD_CSV_URL && st.status!=="fulfilled"){problems.push("standard");console.warn("Standard CSV:",st.reason);}
  try{render(data,problems);}catch(err){showErr(err.message||err);throw err;}
  if(problems.length && !retryTimer){retryTimer=setTimeout(function(){retryTimer=null;refresh();},60000);}
}
function tick(){
  const now=todayDate();const real=new Date();
  document.getElementById("clock").textContent=real.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("today").textContent=now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function fitStage(){
  const cw=document.documentElement.clientWidth||window.innerWidth;
  const ch=document.documentElement.clientHeight||window.innerHeight;
  const s=Math.min((cw-8)/1920,(ch-8)/1080);
  document.getElementById("stage").style.transform="scale("+s+")";
}
window.addEventListener("resize",()=>{fitStage();fitColumns();fitSched();});
initNav();
/* instant first paint: show the grid with standard hours while the CSVs load */
if(VIEW!=="holidays"){try{render([],[]);}catch(e){console.warn("first paint:",e);}}
(function(){
  const rerender=function(){if(LAST_RENDER_DATA)render(LAST_RENDER_DATA,LAST_PROBLEMS);};
  const pv=document.getElementById("month-prev"),nx=document.getElementById("month-next"),td=document.getElementById("month-today");
  if(pv)pv.onclick=function(){MONTH_OFFSET--;rerender();};
  if(nx)nx.onclick=function(){MONTH_OFFSET++;rerender();};
  if(td)td.onclick=function(){MONTH_OFFSET=0;rerender();};
  const wp=document.getElementById("week-prev"),wn=document.getElementById("week-next"),wt=document.getElementById("week-today");
  if(wp)wp.onclick=function(){WEEK_OFFSET--;rerender();};
  if(wn)wn.onclick=function(){WEEK_OFFSET++;rerender();};
  if(wt)wt.onclick=function(){WEEK_OFFSET=0;rerender();};
  const qp=document.getElementById("q-prev"),qn=document.getElementById("q-next"),qt=document.getElementById("q-today");
  if(qp)qp.onclick=function(){QUARTER_OFFSET--;rerender();};
  if(qn)qn.onclick=function(){QUARTER_OFFSET++;rerender();};
  if(qt)qt.onclick=function(){QUARTER_OFFSET=0;rerender();};
})();
fitStage();tick();refresh();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitColumns);
setInterval(tick,10000);
setInterval(refresh,REFRESH_MINUTES*60000);
</script>
